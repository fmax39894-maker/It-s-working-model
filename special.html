<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">

<title>Special</title>

<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/animation.css">
<link rel="stylesheet" href="css/navbar.css">
<link rel="stylesheet" href="css/special.css">

</head>


<body>


<!-- =========================================
        BACKGROUND
========================================= -->

<div class="special-bg"></div>


<!-- =========================================
        HEADER
========================================= -->

<header class="gallery-header">

    <div class="logo">

        <img
        src="assets/logo/logo.png"
        alt="Logo">

    </div>


   <button
class="menu-btn ripple"
onclick="goMenu()">

⋮

</button>

</header>


<!-- =========================================
        SPECIAL CONTENT
========================================= -->

<main class="special-page">

    <section class="special-card">

        <div class="special-icon">

            ✨

        </div>


        <h1>

            Special

        </h1>


        <p>

            Discover the special content of this website.

        </p>


        <button
        class="special-button ripple"
        id="getSpecialBtn"
        type="button">

            ✨ Get Special

        </button>

    </section>

</main>


<!-- =========================================
        SPECIAL RESULT
========================================= -->

<div
id="specialResult"
class="special-result">

</div>


<!-- =========================================
        BOTTOM NAVIGATION
========================================= -->

<nav class="bottom-nav special show">

    <div class="indicator"></div>


    <div
    class="nav-item"
    data-page="index.html">

        <span class="nav-symbol">

            <img src="assets/icons/home.png">

        </span>

        <small>Home</small>

    </div>


    <div
    class="nav-item"
    data-page="videos.html">

        <span class="nav-symbol">

            <img src="assets/icons/videos.png">

        </span>

        <small>Videos</small>

    </div>


    <div
    class="nav-item"
    data-page="images.html">

        <span class="nav-symbol">

            <img src="assets/icons/images.png">

        </span>

        <small>Images</small>

    </div>


    <div
    class="nav-item active"
    data-page="special.html">

        <span class="nav-symbol">

            <img src="assets/icons/special.png">

        </span>

        <small>Special</small>

    </div>

</nav>


<!-- =========================================
        JAVASCRIPT
========================================= -->

<script src="js/app.js"></script>

<script src="js/navbar.js"></script>

<script src="js/special.js"></script>


</body>

</html>
