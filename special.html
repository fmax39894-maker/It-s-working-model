<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">

<title>Special</title>

<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/animation.css">
<link rel="stylesheet" href="css/navbar.css">
<link rel="stylesheet" href="css/special.css">

</head>


<body>


<!-- =========================================
        BACKGROUND
========================================= -->

<div class="special-bg"></div>


<!-- =========================================
        HEADER
========================================= -->

<header class="gallery-header">

    <div class="logo">

        <img
        src="assets/logo/logo.png"
        alt="Logo">

    </div>


    <button
    class="menu-btn ripple"
    onclick="goMenu()">

        ⋮

    </button>

</header>


<!-- =========================================
        QR AREA
========================================= -->

<main class="special-content">


    <div class="qr-box">

        <img
        src="assets/special/qr.png"
        class="qr-image"
        alt="QR Code">

    </div>


    <!-- DOWNLOAD -->

    <a
    href="assets/special/qr.png"
    download="QR-Code.png"
    class="qr-download">

        ⬇ Download QR

    </a>


</main>


<!-- =========================================
        BOTTOM NAVIGATION
========================================= -->

<nav class="bottom-nav special">


    <div
    class="nav-item"
    data-page="index.html">

        <img
        src="assets/icons/home.png"
        alt="Home">

        <small>Home</small>

    </div>


    <div
    class="nav-item"
    data-page="videos.html">

        <img
        src="assets/icons/videos.png"
        alt="Videos">

        <small>Videos</small>

    </div>


    <div
    class="nav-item"
    data-page="images.html">

        <img
        src="assets/icons/images.png"
        alt="Images">

        <small>Images</small>

    </div>


    <div
    class="nav-item active"
    data-page="special.html">

        <img
        src="assets/icons/special.png"
        alt="Special">

        <small>Special</small>

    </div>


</nav>


<!-- =========================================
        JAVASCRIPT
========================================= -->

<script src="js/app.js"></script>

<script src="js/navbar.js"></script>


</body>

</html>
