<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1.0">

<title>Special</title>

<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/animation.css">
<link rel="stylesheet" href="css/navbar.css">
<link rel="stylesheet" href="css/special.css">

</head>

<body>

<!-- Fullscreen Video -->

<div class="special-container">

<video

id="specialVideo"

class="special-video"

autoplay

muted

playsinline>

<source

src="assets/special/video.mp4"

type="video/mp4">

</video>

<button

id="magicBtn"

class="magic-btn">

✨ Open Surprise

</button>

</div>

<!-- Fullscreen Image Viewer -->

<div

id="specialViewer"

class="special-viewer">

<button

id="closeSpecial"

class="close-viewer">

✕

</button>

<img

id="specialImage"

src="assets/special/image.png"

alt="Special Image">

<a

href="assets/special/image.png"

download>

<button

class="download">

⬇ Download

</button>

</a>

</div>

<!-- Header -->

<header class="gallery-header">

<img

src="assets/logo/logo.png"

class="gallery-logo"

alt="Logo">

<button

class="menu-btn ripple"

onclick="goMenu()">

☰

</button>

</header>

<!-- Bottom Navigation -->

<nav class="bottom-nav special">

<div class="indicator"></div>

<div class="nav-item"

data-page="index.html">

<span>🏠</span>

<small>Home</small>

</div>

<div class="nav-item"

data-page="videos.html">

<span>🎥</span>

<small>Videos</small>

</div>

<div class="nav-item"

data-page="images.html">

<span>🖼️</span>

<small>Images</small>

</div>

<div class="nav-item active"

data-page="special.html">

<span>✨</span>

<small>Special</small>

</div>

</nav>

<!-- Scripts -->

<script src="js/app.js"></script>

<script src="js/navbar.js"></script>

<script src="js/special.js"></script>

</body>

</html>
