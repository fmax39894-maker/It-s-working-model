<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1.0">

<title>Heart Videos</title>

<link rel="stylesheet"
href="css/gallery.css">

</head>

<body>

<!-- Background -->

<div style="
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:url('/assets/backgrounds/videos.jpg') center center/cover no-repeat;
z-index:-3;
"></div>

<div class="overlay"></div>

<!-- Header -->

<header>

<button
class="navBtn"
onclick="history.back()">

<img src="/assets/buttons/back.png">

<span>Back</span>

</button>

<h1>
🎥 Heart Videos
</h1>

<button
class="navBtn"
onclick="location.href='home.html'">

<img src="/assets/buttons/home.png">

<span>Home</span>

</button>

</header>

<!-- Search -->

<div class="searchBox">

<input
type="text"
id="search"
placeholder="Search Videos...">

<img
src="/assets/icons/search.png"
class="searchIcon">

</div>

<!-- Gallery -->

<div
id="gallery"
class="gallery">

<!-- Videos will load automatically -->

</div>

<!-- Loading -->

<div id="loading">

<img
src="/assets/icons/loading.gif">

<p>

Loading Videos...

</p>

</div>

<!-- Empty -->

<div
id="empty"
style="display:none;">

<img
src="/assets/icons/video.png">

<h2>

No Videos Found

</h2>

</div>

<script src="js/videos.js"></script>

</body>

</html>
