<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

html,body{

width:100%;
height:100%;

overflow:hidden;

background:#000;

}

#introVideo{

position:fixed;

top:0;
left:0;

width:100%;
height:100%;

object-fit:cover;

background:#000;

}

#loading{

position:fixed;

bottom:20px;

left:50%;

transform:translateX(-50%);

color:white;

font-size:18px;

font-family:Arial,sans-serif;

text-shadow:0 0 10px red;

}

.fade{

animation:fadeOut .8s forwards;

}

@keyframes fadeOut{

to{

opacity:0;

}

}

</style>

</head>

<body>

<video
id="introVideo"
autoplay
muted
playsinline>

<source
src="/assets/intro.mp4"
type="video/mp4">

</video>

<div id="loading">

Loading...

</div>

<script>

const video=document.getElementById("introVideo");

video.onended=()=>{

document.body.classList.add("fade");

setTimeout(()=>{

location.href="home.html";

},800);

};

// If video cannot play, go to home after 8 seconds

setTimeout(()=>{

location.href="home.html";

},8000);

</script>
