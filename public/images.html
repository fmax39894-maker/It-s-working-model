<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Heart Images</title>

<link rel="stylesheet"
href="css/gallery.css">

</head>

<body>

<!-- Background -->

<div class="bg"></div>

<!-- Dark Overlay -->

<div class="overlay"></div>

<!-- Header -->

<header>

<button
class="navBtn"
onclick="history.back()">

<img src="/assets/buttons/back.png">

<span>Back</span>

</button>

<h1>

🫀 Heart Images

</h1>

<button
class="navBtn"
onclick="location.href='home.html'">

<img src="/assets/buttons/home.png">

<span>Home</span>

</button>

</header>

<!-- Search -->

<div class="searchBox">

<input

type="text"

id="search"

placeholder="Search Images...">

<img

src="/assets/icons/search.png"

class="searchIcon">

</div>

<!-- Gallery -->

<div

id="gallery"

class="gallery">

<!-- Images will appear automatically -->

</div>

<!-- Loading -->

<div id="loading">

<img

src="/assets/icons/loading.gif">

<p>

Loading Images...

</p>

</div>

<!-- Empty -->

<div

id="empty"

style="display:none;">

<img

src="/assets/icons/image.png">

<h2>

No Images Found

</h2>

</div>

<script src="js/gallery.js"></script>

</body>

</html>
