<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">

<title>Media Showcase</title>

<meta name="theme-color" content="#000000">

<!-- Website Preview -->

<meta property="og:title" content="Media Showcase">
<meta property="og:description" content="Premium Media Gallery">
<meta property="og:image" content="assets/cover.jpg">
<meta property="og:type" content="website">

<meta property="twitter:card" content="summary_large_image">
<meta property="twitter:image" content="assets/cover.jpg">

<link rel="icon" href="assets/logo/logo.png">

<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/animation.css">
<link rel="stylesheet" href="css/frame.css">
<link rel="stylesheet" href="css/navbar.css">
<link rel="stylesheet" href="css/home.css">

</head>

<body>

<!-- ==========================
        LOADER
=========================== -->

<div id="loader" class="center">

    <img
    src="assets/logo/logo.png"
    class="loader-logo pulse"
    alt="Logo">

</div>

<!-- ==========================
    BACKGROUND VIDEO
=========================== -->

<video
id="bgVideo"
class="bg-video"
autoplay
muted
loop
playsinline
preload="auto">

<source
src="assets/backgrounds/home.mp4"
type="video/mp4">

</video>

<div class="overlay"></div>

<!-- ==========================
        HEADER
=========================== -->

<header id="header">

    <div class="logo fade-down">

        <img
        src="assets/logo/logo.png"
        alt="Website Logo">

    </div>

 <button
class="menu-btn ripple"
onclick="goMenu()">

⋮

</button>

</header>

<!-- ==========================
        HOME PAGE
=========================== -->

<section
class="page"
id="homePage">

    <div class="home-center">

        <div class="welcome-glow">

        </div>

    </div>

</section>

<!-- ==========================
        PARTICLES
=========================== -->

<div id="particles"></div>

<!-- ==========================
      BOTTOM NAVIGATION
=========================== -->

<nav class="bottom-nav home show">

    <div class="indicator"></div>

    <div class="nav-item active"
         data-page="index.html">

        <img
        src="assets/icons/home.png"
        alt="Home">

        <small>Home</small>

    </div>

    <div class="nav-item"
         data-page="videos.html">

        <img
        src="assets/icons/videos.png"
        alt="Videos">

        <small>Videos</small>

    </div>

    <div class="nav-item"
         data-page="images.html">

        <img
        src="assets/icons/images.png"
        alt="Images">

        <small>Images</small>

    </div>

    <div class="nav-item"
         data-page="special.html">

        <img
        src="assets/icons/special.png"
        alt="Special">

        <small>Special</small>

    </div>

</nav>

<!-- ==========================
          AUDIO
=========================== -->

<audio
id="clickSound"
preload="auto">

    <source
    src="sounds/click.mp3"
    type="audio/mpeg">

</audio>

<!-- ==========================
        JAVASCRIPT
=========================== -->

<script src="js/app.js"></script>

<script src="js/navbar.js"></script>

<script src="js/home.js"></script>

</body>

</html>
