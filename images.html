<body>

<div class="image-bg"></div>

<header class="gallery-header">

<img
src="assets/logo/logo.png"
class="gallery-logo">

<button
class="menu-btn ripple"
onclick="goMenu()">

☰

</button>

</header>

<div class="image-gallery">

<!-- Image 1 -->

<div class="image-card">

<div class="image-frame">

<img

src="assets/images/image1.png"

class="gallery-image"

</div>

<h3>

Image 1

</h3>

</div>

<!-- Image 2 -->

Image 2

</h3>

</div>

<!-- Image 3 -->

<div class="image-frame">

</div>

<h3>

Image 3

</h3>

</div>

<!-- Image 4 -->

<div class="image-card">

<div class="image-frame">

<img
src="assets/images/image4.png"
class="gallery-image"
alt="Image 4">

</div>

<h3>

Image 4

</h3>

</div>

</div>

<!-- Fullscreen Image Viewer -->

<div id="imageViewer" class="viewer">

<button
class="close-viewer">

✕

</button>

<img
id="fullImage"
src=""
alt="Preview">

<a
id="downloadImage"
href=""
download>

<button class="download">

</button>

</a>
