<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">

<title>Images</title>

<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/animation.css">
<link rel="stylesheet" href="css/navbar.css">
<link rel="stylesheet" href="css/image.css">

</head>


<body>


<!-- =========================================
        BACKGROUND
========================================= -->

<div class="image-bg"></div>


<!-- =========================================
        HEADER
========================================= -->

<header class="gallery-header">

    <div class="logo">

        <img
        src="assets/logo/logo.png"
        alt="Logo">

    </div>


 <button
class="menu-btn ripple"
onclick="goMenu()">

⋮

</button>

</header>


<!-- =========================================
        IMAGE GALLERY
========================================= -->

<main class="image-gallery">


    <!-- IMAGE 1 -->

    <article class="image-card">

        <div class="image-frame">

            <img
            src="assets/images/image1.jpg"
            alt="Image 1"
            loading="lazy">

        </div>

        <h3>Image 1</h3>

    </article>



    <!-- IMAGE 2 -->

    <article class="image-card">

        <div class="image-frame">

            <img
            src="assets/images/image2.jpg"
            alt="Image 2"
            loading="lazy">

        </div>

        <h3>Image 2</h3>

    </article>



    <!-- IMAGE 3 -->

    <article class="image-card">

        <div class="image-frame">

            <img
            src="assets/images/image3.jpg"
            alt="Image 3"
            loading="lazy">

        </div>

        <h3>Image 3</h3>

    </article>



    <!-- IMAGE 4 -->

    <article class="image-card">

        <div class="image-frame">

            <img
            src="assets/images/image4.jpg"
            alt="Image 4"
            loading="lazy">

        </div>

        <h3>Image 4</h3>

    </article>


</main>



<!-- =========================================
        FULLSCREEN IMAGE VIEWER
========================================= -->

<div
id="imageViewer"
class="viewer">


    <button
    class="close-viewer"
    type="button">

        ✕

    </button>


    <img
    id="viewerImage"
    src=""
    alt="Full Screen Image">


    <a
    id="downloadImage"
    href=""
    download>

        <button
        class="download"
        type="button">

            ⬇ Download

        </button>

    </a>

</div>



<!-- =========================================
        BOTTOM NAVIGATION
========================================= -->

<nav class="bottom-nav image show">

    <div class="indicator"></div>


    <div
    class="nav-item"
    data-page="index.html">

        <img
        src="assets/icons/home.png"
        alt="Home">

        <small>Home</small>

    </div>


    <div
    class="nav-item"
    data-page="videos.html">

        <img
        src="assets/icons/videos.png"
        alt="Videos">

        <small>Videos</small>

    </div>


    <div
    class="nav-item active"
    data-page="images.html">

        <img
        src="assets/icons/images.png"
        alt="Images">

        <small>Images</small>

    </div>


    <div
    class="nav-item"
    data-page="special.html">

        <img
        src="assets/icons/special.png"
        alt="Special">

        <small>Special</small>

    </div>

</nav>



<!-- =========================================
        JAVASCRIPT
========================================= -->

<script src="js/app.js"></script>

<script src="js/navbar.js"></script>

<script src="js/image.js"></script>


</body>

</html>
