<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">

<title>Videos</title>

<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/animation.css">
<link rel="stylesheet" href="css/navbar.css">
<link rel="stylesheet" href="css/video.css">

</head>

<body>

<!-- ==========================
        BACKGROUND
========================== -->

<div class="video-bg"></div>

<!-- ==========================
        HEADER
========================== -->

<header class="gallery-header">

<div class="logo">

<img
src="assets/logo/logo.png"
alt="Logo">

</div>

<button
class="menu-btn ripple"
onclick="goMenu()">

☰

</button>

</header>

<!-- ==========================
      VIDEO GALLERY
========================== -->

<div class="video-gallery">

<!-- ==========================
        VIDEO CARD 1
========================== -->

<div class="video-card"
     data-video="assets/videos/video1.mp4">

    <div class="video-frame">

        <video
        class="cover-video"
        muted
        preload="metadata"
        playsinline>

            <source
            src="assets/videos/video1.mp4"
            type="video/mp4">

        </video>

        <div class="play-btn">

            ▶

        </div>

    </div>

    <h3>Video 1</h3>

</div>

<!-- ==========================
        VIDEO CARD 2
========================== -->

<div class="video-card"
     data-video="assets/videos/video2.mp4">

    <div class="video-frame">

        <video
        class="cover-video"
        muted
        preload="metadata"
        playsinline>

            <source
            src="assets/videos/video2.mp4"
            type="video/mp4">

        </video>

        <div class="play-btn">

            ▶

        </div>

    </div>

    <h3>Video 2</h3>

</div>

<!-- ==========================
        VIDEO CARD 3
========================== -->

<div class="video-card"
     data-video="assets/videos/video3.mp4">

    <div class="video-frame">

        <video
        class="cover-video"
        muted
        preload="metadata"
        playsinline>

            <source
            src="assets/videos/video3.mp4"
            type="video/mp4">

        </video>

        <div class="play-btn">

            ▶

        </div>

    </div>

    <h3>Video 3</h3>

</div>

<!-- ==========================
        VIDEO CARD 4
========================== -->

<div class="video-card"
     data-video="assets/videos/video4.mp4">

    <div class="video-frame">

        <video
        class="cover-video"
        muted
        preload="metadata"
        playsinline>

            <source
            src="assets/videos/video4.mp4"
            type="video/mp4">

        </video>

        <div class="play-btn">

            ▶

        </div>

    </div>

    <h3>Video 4</h3>

</div>

</div>

<!-- ==========================
     FULLSCREEN PLAYER
========================== -->

<div id="videoViewer" class="viewer">

    <button
    class="close-viewer">

        ✕

    </button>

    <video
    id="player"
    controls
    playsinline>

        <source
        src=""
        type="video/mp4">

    </video>

    <a
    id="downloadVideo"
    href=""
    download>

        <button
        class="download">

            ⬇ Download

        </button>

    </a>

</div>

<!-- ==========================
      BOTTOM NAVIGATION
========================== -->

<nav class="bottom-nav video show">

    <div class="indicator"></div>

    <div class="nav-item"
         data-page="index.html">

        <img
        src="assets/icons/home.png"
        alt="Home">

        <small>Home</small>

    </div>

    <div class="nav-item active"
         data-page="videos.html">

        <img
        src="assets/icons/videos.png"
        alt="Videos">

        <small>Videos</small>

    </div>

    <div class="nav-item"
         data-page="images.html">

        <img
        src="assets/icons/images.png"
        alt="Images">

        <small>Images</small>

    </div>

    <div class="nav-item"
         data-page="special.html">

        <img
        src="assets/icons/special.png"
        alt="Special">

        <small>Special</small>

    </div>

</nav>

<!-- ==========================
          JAVASCRIPT
========================== -->

<script src="js/app.js"></script>

<script src="js/navbar.js"></script>

<script src="js/video.js"></script>

</body>

</html>
