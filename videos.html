<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1.0">

<title>Videos</title>

<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/animation.css">
<link rel="stylesheet" href="css/navbar.css">
<link rel="stylesheet" href="css/video.css">

</head>

<body>

<!-- Background -->

<div class="video-bg"></div>

<!-- Header -->

<header class="gallery-header">

<img
src="assets/logo/logo.png"
class="gallery-logo">

<button
class="menu-btn ripple"
onclick="goMenu()">

☰

</button>

</header>

<!-- Gallery -->

<div class="video-gallery">

<img src="assets/icons/home.png">
<img src="assets/icons/videos.png">
<img src="assets/icons/images.png">
<img src="assets/icons/special.png">

<h3>

Video 4

</h3>

</div>

</div>

<!-- Fullscreen Video Player -->

<div id="videoViewer" class="viewer">

<button
class="close-viewer">

✕

</button>

<video
id="player"
controls
playsinline>

<source
src=""
type="video/mp4">

</video>

<a
id="downloadVideo"
href=""
download>

<button class="download">

⬇ Download

</button>

</a>

</div>

<!-- Bottom Navigation -->

<nav class="bottom-nav video">

<div class="indicator"></div>

<div class="nav-item"
data-page="index.html">

<span><img src="assets/icons/home.png"></span>

<small>Home</small>

</div>

<div class="nav-item active"
data-page="videos.html">

<span><img src="assets/icons/videos.png"></span>

<small>Videos</small>

</div>

<div class="nav-item"
data-page="images.html">

<span><img src="assets/icons/images.png"></span>

<small>Images</small>

</div>

<div class="nav-item"
data-page="special.html">

<span><img src="assets/icons/special.png"></span>

<small>Special</small>

</div>

</nav>

<script src="js/app.js"></script>

<script src="js/navbar.js"></script>

<script src="js/video.js"></script>

</body>

</html>
