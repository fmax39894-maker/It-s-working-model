<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">

<title>More</title>

<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/animation.css">
<link rel="stylesheet" href="css/navbar.css">
<link rel="stylesheet" href="css/menu.css">

</head>

<body>


<!-- =========================================
        BACKGROUND
========================================= -->

<div class="menu-bg"></div>


<!-- =========================================
        HEADER
========================================= -->

<header class="gallery-header">

    <div class="logo">

        <img
        src="assets/logo/logo.png"
        alt="Logo">

    </div>


    <button
    class="menu-btn"
    onclick="goHome()"
    aria-label="Close">

        ✕

    </button>

</header>


<!-- =========================================
        DESCRIPTION & LINKS
========================================= -->

<main class="menu-page">

    <section class="menu-card">

        <div class="menu-icon">

            ⋮

        </div>


        <h1>

            More

        </h1>


        <p>

            About this website and useful links

        </p>


        <!-- DESCRIPTION -->

        <div class="info-section">

            <h2>

                📖 Description

            </h2>

            <p>

                Welcome to our Media Showcase.

                This website contains our images,
                videos and special content in one
                place.

            </p>

        </div>


        <!-- WEBSITE -->

        <div class="info-section">

            <h2>

                🌐 Website

            </h2>

            <a
            href="#"
            class="menu-link">

                Visit Website

            </a>

        </div>


        <!-- SOCIAL LINK -->

        <div class="info-section">

            <h2>

                🔗 Links

            </h2>

            <a
            href="#"
            class="menu-link">

                Social / Contact

            </a>

        </div>


        <!-- BACK -->

        <button
        class="menu-option ripple"
        onclick="goHome()">

            <span>←</span>

            <strong>Back to Home</strong>

        </button>

    </section>

</main>


<!-- =========================================
        BOTTOM NAVIGATION
========================================= -->

<nav class="bottom-nav menu show">


    <div
    class="nav-item"
    onclick="goHome()">

        <img
        src="assets/icons/home.png"
        alt="Home">

        <small>

            Home

        </small>

    </div>


    <div
    class="nav-item"
    onclick="goVideos()">

        <img
        src="assets/icons/videos.png"
        alt="Videos">

        <small>

            Videos

        </small>

    </div>


    <div
    class="nav-item"
    onclick="goImages()">

        <img
        src="assets/icons/images.png"
        alt="Images">

        <small>

            Images

        </small>

    </div>


    <div
    class="nav-item"
    onclick="goSpecial()">

        <img
        src="assets/icons/special.png"
        alt="Special">

        <small>

            Special

        </small>

    </div>


</nav>


<!-- =========================================
        JAVASCRIPT
========================================= -->

<script src="js/app.js"></script>

<script src="js/navbar.js"></script>

</body>

</html>
