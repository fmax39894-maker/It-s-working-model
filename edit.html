<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width,initial-scale=1.0"
>

<title>Heart Project Editor</title>

<style>

*{
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    margin:0;
    background:#08090b;
    color:#f5f5f5;
    font-family:
        Arial,
        Helvetica,
        sans-serif;
}

.container{
    width:100%;
    max-width:900px;
    margin:auto;
    padding:24px 18px 60px;
}


/* =========================================
   HEADER
========================================= */

.header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:15px;
    margin-bottom:35px;
}

.header h1{
    margin:0;
    font-size:40px;
    font-weight:800;
}

.header h1 span{
    color:#ff2438;
}

.website-btn{
    display:inline-block;
    text-decoration:none;
    color:white;
    background:#15171b;
    border:1px solid #303238;
    border-radius:18px;
    padding:15px 23px;
    font-size:18px;
}

.website-btn:active{
    transform:scale(.97);
}


/* =========================================
   CARD
========================================= */

.card{
    background:#121419;
    border:1px solid #292c32;
    border-radius:28px;
    padding:28px;
    margin-bottom:24px;
}

.card-title{
    margin:0 0 24px;
    color:#ff2438;
    font-size:29px;
    font-weight:800;
}


/* =========================================
   STATUS
========================================= */

.status{
    display:flex;
    align-items:center;
    gap:12px;

    min-height:65px;

    padding:18px;

    margin-top:13px;

    background:#090a0d;

    border:1px solid #292c32;

    border-radius:18px;

    font-size:18px;

    color:#aaa;
}

.status.ok{
    color:#69e77f;
    border-color:#245d31;
}

.status.error{
    color:#ff6977;
    border-color:#6a252d;
}

.status.loading{
    color:#c5c5c5;
}

.status-icon{
    font-size:23px;
}


/* =========================================
   FORM
========================================= */

.field{
    margin-bottom:20px;
}

.field label{
    display:block;
    margin-bottom:9px;
    color:#bcbcc2;
    font-size:17px;
}

input[type="text"],
select{
    width:100%;
    height:58px;

    padding:0 17px;

    border-radius:16px;

    border:1px solid #303239;

    outline:none;

    background:#08090b;

    color:white;

    font-size:17px;
}

input[type="text"]:focus,
select:focus{
    border-color:#ff2438;
}


.file-box{
    border:1px dashed #3a3d43;
    border-radius:18px;
    padding:18px;
    background:#090a0d;
}

input[type="file"]{
    width:100%;
    color:#ddd;
    font-size:15px;
}


.file-info{
    margin-top:12px;
    color:#777;
    font-size:14px;
    line-height:1.5;
}


/* =========================================
   BUTTON
========================================= */

.upload-btn{
    border:0;
    border-radius:16px;

    padding:16px 27px;

    background:#ff2438;
    color:white;

    font-size:18px;
    font-weight:700;

    cursor:pointer;

    transition:.2s;
}

.upload-btn:hover{
    filter:brightness(1.08);
}

.upload-btn:active{
    transform:scale(.97);
}

.upload-btn:disabled{
    opacity:.55;
    cursor:not-allowed;
}


/* =========================================
   PROGRESS
========================================= */

.progress-area{
    display:none;
    margin-top:20px;
}

.progress{
    width:100%;
    height:10px;

    background:#292c31;

    border-radius:20px;

    overflow:hidden;
}

.progress-bar{
    width:0%;
    height:100%;

    background:#ff2438;

    transition:width .2s;
}

.progress-label{
    margin-top:8px;
    color:#999;
    font-size:14px;
}


/* =========================================
   MESSAGE
========================================= */

.message{
    display:none;

    margin-top:18px;

    padding:15px;

    border-radius:15px;

    line-height:1.5;

    font-size:15px;
}

.message.success{
    display:block;

    color:#6ee982;

    background:#102317;

    border:1px solid #285d35;
}

.message.error{
    display:block;

    color:#ff6b79;

    background:#291014;

    border:1px solid #6d252e;
}


/* =========================================
   MEDIA LIST
========================================= */

.media-list{
    display:grid;

    grid-template-columns:
        repeat(
            auto-fit,
            minmax(230px,1fr)
        );

    gap:20px;
}

.media-card{
    overflow:hidden;

    background:#090a0d;

    border:1px solid #2c2f35;

    border-radius:20px;
}

.preview{
    width:100%;
    height:190px;

    background:#050608;

    display:flex;

    justify-content:center;
    align-items:center;

    overflow:hidden;
}

.preview img,
.preview video{
    width:100%;
    height:100%;
    object-fit:cover;
}

.video-icon{
    font-size:50px;
}

.media-body{
    padding:17px;
}

.media-name{
    font-size:18px;
    font-weight:700;
    margin-bottom:7px;

    word-break:break-word;
}

.media-type{
    color:#999;
    font-size:14px;
    margin-bottom:12px;
}

.media-url{
    padding:11px;

    background:#111318;

    border:1px solid #292c31;

    border-radius:11px;

    color:#8f8f95;

    font-size:12px;

    line-height:1.4;

    word-break:break-all;

    margin-bottom:13px;
}

.copy-btn,
.delete-btn{
    width:100%;

    padding:12px;

    border-radius:12px;

    font-size:15px;

    cursor:pointer;
}

.copy-btn{
    margin-bottom:8px;

    background:#17191e;

    border:1px solid #33363d;

    color:#ddd;
}

.delete-btn{
    background:#281014;

    border:1px solid #70252f;

    color:#ff6978;
}


/* =========================================
   EMPTY
========================================= */

.empty{
    grid-column:1/-1;

    padding:35px 15px;

    text-align:center;

    color:#777;

    line-height:1.6;
}


/* =========================================
   SMALL SCREEN
========================================= */

@media(max-width:600px){

    .container{
        padding:20px 16px 50px;
    }

    .header{
        align-items:flex-start;
    }

    .header h1{
        font-size:32px;
    }

    .website-btn{
        padding:13px 16px;
        font-size:16px;
    }

    .card{
        padding:21px;
        border-radius:24px;
    }

    .card-title{
        font-size:27px;
    }

}

</style>

</head>


<body>


<div class="container">


    <!-- =====================================
         HEADER
    ====================================== -->

    <header class="header">

        <h1>
            Heart <span>Editor</span>
        </h1>

        <a
            href="index.html"
            class="website-btn"
        >
            ← Website
        </a>

    </header>



    <!-- =====================================
         SYSTEM STATUS
    ====================================== -->

    <section class="card">

        <h2 class="card-title">
            System Status
        </h2>


        <div
            id="firebaseStatus"
            class="status loading"
        >

            <span class="status-icon">
                🔄
            </span>

            <span>
                Connecting to Firebase...
            </span>

        </div>


        <div
            id="cloudinaryStatus"
            class="status loading"
        >

            <span class="status-icon">
                ☁️
            </span>

            <span>
                Checking Cloudinary...
            </span>

        </div>

    </section>



    <!-- =====================================
         ADD MEDIA
    ====================================== -->

    <section class="card">

        <h2 class="card-title">
            Add Project Media
        </h2>


        <div class="field">

            <label for="mediaName">
                Media Name
            </label>

            <input
                id="mediaName"
                type="text"
                placeholder="Example: Heart Model"
            >

        </div>



        <div class="field">

            <label for="mediaType">
                Media Type
            </label>

            <select id="mediaType">

                <option value="image">
                    📸 Photo
                </option>

                <option value="video">
                    🎬 Video
                </option>

            </select>

        </div>



        <div class="field">

            <label for="mediaFile">
                Select Image / Video
            </label>


            <div class="file-box">

                <input
                    id="mediaFile"
                    type="file"
                    accept="image/*,video/*"
                >


                <div
                    id="fileInfo"
                    class="file-info"
                >
                    No file selected.
                </div>

            </div>

        </div>



        <button
            id="uploadBtn"
            class="upload-btn"
            type="button"
        >
            Upload Media
        </button>



        <div
            id="progressArea"
            class="progress-area"
        >

            <div class="progress">

                <div
                    id="progressBar"
                    class="progress-bar"
                ></div>

            </div>


            <div
                id="progressLabel"
                class="progress-label"
            >
                0%
            </div>

        </div>



        <div
            id="message"
            class="message"
        ></div>



        <p
            style="
                color:#85858b;
                line-height:1.6;
                margin:28px 0 0;
            "
        >
            Images and videos are uploaded to Cloudinary.
            Firebase Firestore stores the media name,
            type and direct URL.
        </p>

    </section>



    <!-- =====================================
         EXISTING MEDIA
    ====================================== -->

    <section class="card">

        <h2 class="card-title">
            Project Media
        </h2>


        <div
            id="mediaList"
            class="media-list"
        >

            <div class="empty">
                Loading project media...
            </div>

        </div>

    </section>


</div>



<!-- =================================================
     CLOUDINARY FILES
================================================== -->

<script src="cloudinary-config.js"></script>

<script src="cloudinary-uploads.js"></script>



<!-- =================================================
     FIREBASE
================================================== -->

<script type="module">

"use strict";


/*
=========================================================
        FIREBASE IMPORT
=========================================================
*/

import {

    collection,
    addDoc,
    getDocs,
    deleteDoc,
    doc,
    query,
    orderBy,
    serverTimestamp

}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


import {

    db

}
from "./firebase-config.js";



/*
=========================================================
        FIRESTORE COLLECTION
=========================================================

IMPORTANT:

This must be the SAME collection used
by your working index.html.

Currently:
*/

const COLLECTION_NAME = "media";



/*
=========================================================
        ELEMENTS
=========================================================
*/

const firebaseStatus =
    document.getElementById(
        "firebaseStatus"
    );


const cloudinaryStatus =
    document.getElementById(
        "cloudinaryStatus"
    );


const mediaName =
    document.getElementById(
        "mediaName"
    );


const mediaType =
    document.getElementById(
        "mediaType"
    );


const mediaFile =
    document.getElementById(
        "mediaFile"
    );


const fileInfo =
    document.getElementById(
        "fileInfo"
    );


const uploadBtn =
    document.getElementById(
        "uploadBtn"
    );


const progressArea =
    document.getElementById(
        "progressArea"
    );


const progressBar =
    document.getElementById(
        "progressBar"
    );


const progressLabel =
    document.getElementById(
        "progressLabel"
    );


const message =
    document.getElementById(
        "message"
    );


const mediaList =
    document.getElementById(
        "mediaList"
    );



/*
=========================================================
        FIREBASE STATUS
=========================================================
*/

try{

    if(!db){

        throw new Error(
            "Firestore database object is missing."
        );

    }


    firebaseStatus.className =
        "status ok";


    firebaseStatus.innerHTML = `

        <span class="status-icon">
            ✓
        </span>

        <span>
            Firebase connected
        </span>

    `;

}catch(error){

    firebaseStatus.className =
        "status error";


    firebaseStatus.innerHTML = `

        <span class="status-icon">
            ❌
        </span>

        <span>
            Firebase error:
            ${escapeHtml(error.message)}
        </span>

    `;

}



/*
=========================================================
        CLOUDINARY STATUS
=========================================================

Cloudinary does not need Firebase.

We check whether the configuration
and upload function exist.
=========================================================
*/

function checkCloudinary(){

    const cloudName =
        window.CLOUDINARY_CLOUD_NAME;


    const preset =
        window.CLOUDINARY_UPLOAD_PRESET;


    const uploadFunction =
        window.uploadToCloudinary;


    if(
        !cloudName ||
        cloudName === "YOUR_CLOUD_NAME"
    ){

        cloudinaryStatus.className =
            "status error";


        cloudinaryStatus.innerHTML = `

            <span class="status-icon">
                ❌
            </span>

            <span>
                Cloudinary cloud name missing
            </span>

        `;

        return false;

    }


    if(!preset){

        cloudinaryStatus.className =
            "status error";


        cloudinaryStatus.innerHTML = `

            <span class="status-icon">
                ❌
            </span>

            <span>
                Cloudinary upload preset missing
            </span>

        `;

        return false;

    }


    if(
        typeof uploadFunction !==
        "function"
    ){

        cloudinaryStatus.className =
            "status error";


        cloudinaryStatus.innerHTML = `

            <span class="status-icon">
                ❌
            </span>

            <span>
                cloudinary-uploads.js not loaded
            </span>

        `;

        return false;

    }


    cloudinaryStatus.className =
        "status ok";


    cloudinaryStatus.innerHTML = `

        <span class="status-icon">
            ✓
        </span>

        <span>
            Cloudinary ready
        </span>

    `;


    return true;

}


const cloudinaryReady =
    checkCloudinary();



/*
=========================================================
        FILE SELECT
=========================================================
*/

mediaFile.addEventListener(
    "change",
    function(){

        const file =
            mediaFile.files[0];


        if(!file){

            fileInfo.textContent =
                "No file selected.";

            return;

        }


        const sizeMB =
            (
                file.size /
                (1024 * 1024)
            ).toFixed(2);


        fileInfo.textContent =
            `${file.name} • ${sizeMB} MB`;

    }
);



/*
=========================================================
        MEDIA TYPE CHANGE
=========================================================
*/

mediaType.addEventListener(
    "change",
    function(){

        if(
            mediaType.value === "image"
        ){

            mediaFile.accept =
                "image/*";

        }else{

            mediaFile.accept =
                "video/*";

        }

    }
);



/*
=========================================================
        SHOW MESSAGE
=========================================================
*/

function showMessage(
    text,
    type
){

    message.textContent =
        text;


    message.className =
        "message " + type;

}



/*
=========================================================
        UPLOAD BUTTON
=========================================================
*/

uploadBtn.addEventListener(
    "click",
    uploadMedia
);



/*
=========================================================
        UPLOAD MEDIA
=========================================================
*/

async function uploadMedia(){

    const name =
        mediaName.value.trim();


    const type =
        mediaType.value;


    const file =
        mediaFile.files[0];


    if(!name){

        showMessage(
            "Please enter a media name.",
            "error"
        );

        mediaName.focus();

        return;

    }


    if(!file){

        showMessage(
            "Please select an image or video.",
            "error"
        );

        return;

    }


    if(!cloudinaryReady){

        showMessage(
            "Cloudinary is not ready. Check cloudinary-config.js and cloudinary-uploads.js.",
            "error"
        );

        return;

    }


    /*
    =========================================
        CHECK FILE TYPE
    =========================================
    */

    if(
        type === "image" &&
        !file.type.startsWith("image/")
    ){

        showMessage(
            "The selected file is not an image.",
            "error"
        );

        return;

    }


    if(
        type === "video" &&
        !file.type.startsWith("video/")
    ){

        showMessage(
            "The selected file is not a video.",
            "error"
        );

        return;

    }


    uploadBtn.disabled =
        true;


    uploadBtn.textContent =
        "Uploading...";


    progressArea.style.display =
        "block";


    progressBar.style.width =
        "0%";


    progressLabel.textContent =
        "Preparing upload...";


    message.className =
        "message";


    try{

        /*
        =========================================
            CLOUDINARY
        =========================================
        */

        const result =
            await window.uploadToCloudinary(

                file,

                function(percent){

                    progressBar.style.width =
                        percent + "%";


                    progressLabel.textContent =
                        "Uploading to Cloudinary: " +
                        percent +
                        "%";

                }

            );


        console.log(
            "Cloudinary result:",
            result
        );


        const url =
            window.getCloudinaryUrl
                ? window.getCloudinaryUrl(result)
                : result.secure_url;


        if(!url){

            throw new Error(
                "Cloudinary did not return a secure URL."
            );

        }


        progressBar.style.width =
            "100%";


        progressLabel.textContent =
            "Cloudinary upload complete";


        /*
        =========================================
            FIRESTORE
        =========================================
        */

        await addDoc(

            collection(
                db,
                COLLECTION_NAME
            ),

            {

                name:
                    name,

                type:
                    type,

                url:
                    url,

                createdAt:
                    serverTimestamp(),

                cloudinaryPublicId:
                    result.public_id || "",

                resourceType:
                    result.resource_type || "",

                format:
                    result.format || ""

            }

        );


        /*
        =========================================
            COMPLETE
        =========================================
        */

        showMessage(
            "✓ Media uploaded to Cloudinary and saved to Firebase.",
            "success"
        );


        mediaName.value =
            "";


        mediaFile.value =
            "";


        fileInfo.textContent =
            "No file selected.";


        await loadMedia();


    }catch(error){

        console.error(
            "UPLOAD ERROR:",
            error
        );


        showMessage(
            "❌ " + error.message,
            "error"
        );

    }


    uploadBtn.disabled =
        false;


    uploadBtn.textContent =
        "Upload Media";

}



/*
=========================================================
        LOAD MEDIA
=========================================================
*/

async function loadMedia(){

    mediaList.innerHTML = `

        <div class="empty">
            Loading project media...
        </div>

    `;


    try{

        const reference =
            collection(
                db,
                COLLECTION_NAME
            );


        /*
        Try ordered query first.
        */

        let snapshot;


        try{

            const orderedQuery =
                query(
                    reference,
                    orderBy(
                        "createdAt",
                        "desc"
                    )
                );


            snapshot =
                await getDocs(
                    orderedQuery
                );

        }catch(error){

            /*
            Old documents may not have createdAt.
            Fallback to normal collection read.
            */

            console.warn(
                "Ordered query failed. Using fallback.",
                error
            );


            snapshot =
                await getDocs(
                    reference
                );

        }


        if(snapshot.empty){

            mediaList.innerHTML = `

                <div class="empty">

                    No media found.

                    <br><br>

                    Upload your first photo or video above.

                </div>

            `;

            return;

        }


        mediaList.innerHTML =
            "";


        snapshot.forEach(
            function(item){

                createMediaCard(
                    item.id,
                    item.data()
                );

            }
        );


    }catch(error){

        console.error(
            "LOAD ERROR:",
            error
        );


        mediaList.innerHTML = `

            <div
                class="empty"
                style="color:#ff6977"
            >

                ❌ Could not load Firebase media.

                <br><br>

                ${escapeHtml(
                    error.message
                )}

            </div>

        `;

    }

}



/*
=========================================================
        CREATE MEDIA CARD
=========================================================
*/

function createMediaCard(
    id,
    data
){

    const name =
        data.name ||
        data.title ||
        "Unnamed Media";


    const type =
        data.type ||
        data.mediaType ||
        "image";


    const url =
        data.url ||
        data.link ||
        data.secure_url ||
        "";


    const card =
        document.createElement(
            "article"
        );


    card.className =
        "media-card";


    let preview;


    if(
        type === "video"
    ){

        preview = `

            <div class="preview">

                <video
                    src="${escapeAttribute(url)}"
                    controls
                    preload="metadata"
                ></video>

            </div>

        `;

    }else{

        preview = `

            <div class="preview">

                <img
                    src="${escapeAttribute(url)}"
                    alt="${escapeAttribute(name)}"
                    loading="lazy"
                >

            </div>

        `;

    }


    card.innerHTML = `

        ${preview}

        <div class="media-body">

            <div class="media-name">
                ${escapeHtml(name)}
            </div>


            <div class="media-type">

                ${
                    type === "video"
                    ? "🎬 Video"
                    : "📸 Photo"
                }

            </div>


            <div class="media-url">

                ${escapeHtml(url)}

            </div>


            <button
                class="copy-btn"
                type="button"
            >
                📋 Copy URL
            </button>


            <button
                class="delete-btn"
                type="button"
            >
                🗑 Delete
            </button>

        </div>

    `;


    /*
    =========================================
        COPY
    =========================================
    */

    const copyButton =
        card.querySelector(
            ".copy-btn"
        );


    copyButton.addEventListener(
        "click",
        async function(){

            try{

                await navigator.clipboard.writeText(
                    url
                );


                copyButton.textContent =
                    "✓ URL Copied";


                setTimeout(
                    function(){

                        copyButton.textContent =
                            "📋 Copy URL";

                    },
                    1500
                );


            }catch(error){

                showMessage(
                    "Could not copy URL.",
                    "error"
                );

            }

        }
    );



    /*
    =========================================
        DELETE
    =========================================
    */

    const deleteButton =
        card.querySelector(
            ".delete-btn"
        );


    deleteButton.addEventListener(
        "click",
        async function(){

            const confirmed =
                confirm(
                    `Delete "${name}" from Firebase?`
                );


            if(!confirmed){

                return;

            }


            deleteButton.disabled =
                true;


            deleteButton.textContent =
                "Deleting...";


            try{

                await deleteDoc(

                    doc(
                        db,
                        COLLECTION_NAME,
                        id
                    )

                );


                card.remove();


                showMessage(
                    "✓ Media deleted from Firebase.",
                    "success"
                );


                if(
                    mediaList.children.length === 0
                ){

                    mediaList.innerHTML = `

                        <div class="empty">

                            No media uploaded yet.

                        </div>

                    `;

                }


            }catch(error){

                console.error(
                    error
                );


                deleteButton.disabled =
                    false;


                deleteButton.textContent =
                    "🗑 Delete";


                showMessage(
                    "❌ Delete failed: " +
                    error.message,
                    "error"
                );

            }

        }
    );


    mediaList.appendChild(
        card
    );

}



/*
=========================================================
        SECURITY HELPERS
=========================================================
*/

function escapeHtml(
    value
){

    return String(value)
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );

}


function escapeAttribute(
    value
){

    return escapeHtml(
        value
    );

}
