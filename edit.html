<!doctype html>
<html lang="en">

<head>

<meta charset="utf-8">

<meta
name="viewport"
content="width=device-width,initial-scale=1"
>

<title>Heart Media Editor</title>

<style>

*{
    box-sizing:border-box
}

body{
    margin:0;
    min-height:100vh;
    background:
    radial-gradient(
        circle at top,
        #3c0b12,
        #08090b 55%
    );
    color:#fff;
    font-family:Arial,sans-serif;
    padding:20px
}

.container{
    width:min(900px,100%);
    margin:auto
}

.header{
    text-align:center;
    padding:20px 0 30px
}

.header h1{
    margin:0;
    font-size:32px
}

.header h1 span{
    color:#ff2638
}

.header p{
    color:#999;
    line-height:1.5
}

.card{
    background:#111317;
    border:1px solid #34363c;
    border-radius:18px;
    padding:22px;
    margin-bottom:18px;
    box-shadow:0 20px 50px #0008
}

.card h2{
    margin-top:0;
    color:#ff2638
}

label{
    display:block;
    color:#aaa;
    font-size:12px;
    font-weight:bold;
    margin-bottom:7px
}

input,
select{
    width:100%;
    padding:13px;
    border-radius:10px;
    border:1px solid #383a40;
    background:#08090b;
    color:#fff;
    outline:none;
    margin-bottom:15px
}

input:focus,
select:focus{
    border-color:#ff2638
}

.file-box{
    border:2px dashed #393b42;
    border-radius:14px;
    padding:25px;
    text-align:center;
    cursor:pointer;
    transition:.2s;
    margin-bottom:15px
}

.file-box:hover{
    border-color:#ff2638;
    background:#171013
}

.file-box input{
    display:none
}

.file-name{
    color:#aaa;
    margin-top:8px;
    word-break:break-word
}

.btn{
    width:100%;
    padding:14px;
    border:0;
    border-radius:10px;
    background:#ff2638;
    color:#fff;
    font-size:15px;
    font-weight:bold;
    cursor:pointer;
    transition:.2s
}

.btn:hover{
    transform:translateY(-2px)
}

.btn:disabled{
    opacity:.5;
    cursor:not-allowed;
    transform:none
}

.back{
    display:block;
    text-align:center;
    color:#aaa;
    text-decoration:none;
    margin-top:14px
}

.back:hover{
    color:#ff2638
}

.progress{
    display:none;
    height:9px;
    background:#25272c;
    border-radius:20px;
    overflow:hidden;
    margin-top:15px
}

.progress.show{
    display:block
}

.progress-bar{
    width:0%;
    height:100%;
    background:#ff2638;
    transition:.15s
}

.status{
    margin-top:15px;
    padding:12px;
    border-radius:9px;
    background:#0b0c0f;
    color:#aaa;
    font-size:13px;
    line-height:1.5
}

.status.ok{
    color:#69e58a;
    border:1px solid #285d38
}

.status.error{
    color:#ff6875;
    border:1px solid #67232b
}

.firebase{
    text-align:center;
    color:#777;
    font-size:12px;
    margin-bottom:15px
}

.firebase.connected{
    color:#69e58a
}

.media-list{
    display:grid;
    gap:12px
}

.media-item{
    display:flex;
    align-items:center;
    gap:12px;
    padding:12px;
    border:1px solid #303238;
    border-radius:12px;
    background:#0c0d10
}

.media-preview{
    width:75px;
    height:55px;
    border-radius:8px;
    object-fit:cover;
    background:#050506;
    flex:none
}

.media-info{
    flex:1;
    min-width:0
}

.media-info strong{
    display:block;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis
}

.media-info small{
    color:#777;
    word-break:break-all
}

.delete{
    border:0;
    background:#401017;
    color:#ff6875;
    padding:9px 11px;
    border-radius:8px;
    cursor:pointer
}

.delete:hover{
    background:#ff2638;
    color:#fff
}

.empty{
    text-align:center;
    color:#666;
    padding:25px
}

@media(max-width:500px){

    body{
        padding:12px
    }

    .card{
        padding:17px
    }

    .header h1{
        font-size:26px
    }

    .media-item{
        align-items:flex-start
    }

    .media-preview{
        width:65px;
        height:50px
    }

}

</style>

</head>

<body>

<div class="container">


<div class="header">

<h1>
Working Model of <span>Heart</span>
</h1>

<p>
Firebase + Cloudinary Media Editor
</p>

<div
id="firebaseStatus"
class="firebase"
>
☁️ Connecting to Firebase...
</div>

</div>


<!-- =====================================================
     UPLOAD
===================================================== -->

<div class="card">

<h2>
Upload Media
</h2>


<label>
Media Name
</label>

<input
id="mediaName"
type="text"
placeholder="Example: Heart Model Photo"
>


<label>
Media Type
</label>

<select id="mediaType">

<option value="photo">
📸 Photo
</option>

<option value="video">
🎬 Video
</option>

</select>


<label>
Select File
</label>

<label class="file-box">

<input
id="mediaFile"
type="file"
accept="image/*,video/*"
>

📁 Tap here to select image or video

<div
id="fileName"
class="file-name"
>
No file selected
</div>

</label>


<button
id="uploadBtn"
class="btn"
onclick="uploadMedia()"
>
Upload Media
</button>


<div
id="progress"
class="progress"
>

<div
id="progressBar"
class="progress-bar"
></div>

</div>


<div
id="status"
class="status"
>
Ready.
</div>

</div>


<!-- =====================================================
     FIRESTORE MEDIA
===================================================== -->

<div class="card">

<h2>
Saved Media
</h2>

<div
id="mediaList"
class="media-list"
>

<div class="empty">
Loading media...
</div>

</div>

</div>


<a
href="index.html"
class="back"
>
← Back to Website
</a>


</div>


<script>

const CLOUDINARY_CLOUD_NAME =
"raykjrpl";


const CLOUDINARY_UPLOAD_PRESET =
"It's working heart";


const COLLECTION_NAME =
"heartProjectMedia";


const FIREBASE_CONFIG = {

    apiKey:
    "AIzaSyDdYdMXyUU52kvja7a8jE3-8Bh1ahY3sjU",

    authDomain:
    "working-heart.firebaseapp.com",

    projectId:
    "working-heart",

    storageBucket:
    "working-heart.firebasestorage.app",

    messagingSenderId:
    "583684499453",

    appId:
    "1:583684499453:web:8793e7149555af3a711b94"

};


const fileInput =
document.getElementById(
    "mediaFile"
);


const fileName =
document.getElementById(
    "fileName"
);


fileInput.addEventListener(
    "change",
    function(){

        if(this.files.length){

            fileName.textContent =
            this.files[0].name;

        }else{

            fileName.textContent =
            "No file selected";

        }

    }
);

</script>


<!-- =====================================================
     FIREBASE
===================================================== -->

<script type="module">

import {
    initializeApp
} from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
    getFirestore,
    collection,
    addDoc,
    getDocs,
    deleteDoc,
    doc,
    serverTimestamp
} from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


const app =
initializeApp(
    FIREBASE_CONFIG
);


const db =
getFirestore(app);


window.firebaseDB =
db;


const firebaseStatus =
document.getElementById(
    "firebaseStatus"
);


firebaseStatus.textContent =
"☁️ Firebase connected";

firebaseStatus.classList.add(
    "connected"
);


window.loadMedia =
loadMedia;


window.deleteMedia =
deleteMedia;


/* =====================================================
   UPLOAD
===================================================== */

window.uploadMedia =
async function(){

    const file =
    document.getElementById(
        "mediaFile"
    ).files[0];


    const name =
    document.getElementById(
        "mediaName"
    ).value.trim();


    const type =
    document.getElementById(
        "mediaType"
    ).value;


    const status =
    document.getElementById(
        "status"
    );


    const button =
    document.getElementById(
        "uploadBtn"
    );


    const progress =
    document.getElementById(
        "progress"
    );


    const progressBar =
    document.getElementById(
        "progressBar"
    );


    if(!file){

        showStatus(
            "Please select an image or video.",
            "error"
        );

        return;

    }


    if(!name){

        showStatus(
            "Please enter a media name.",
            "error"
        );

        return;

    }


    if(
        !CLOUDINARY_CLOUD_NAME ||
        CLOUDINARY_CLOUD_NAME ===
        "YOUR_CLOUDINARY_CLOUD_NAME"
    ){

        showStatus(
            "Cloudinary Cloud Name is missing. Put your Cloud Name at the top of edit.html.",
            "error"
        );

        return;

    }


    if(
        !CLOUDINARY_UPLOAD_PRESET
    ){

        showStatus(
            "Cloudinary Upload Preset is missing.",
            "error"
        );

        return;

    }


    try{

        button.disabled =
        true;


        progress.classList.add(
            "show"
        );


        progressBar.style.width =
        "0%";


        showStatus(
            "Uploading file to Cloudinary..."
        );


        const uploadUrl =
        "https://api.cloudinary.com/v1_1/" +
        encodeURIComponent(
            CLOUDINARY_CLOUD_NAME
        ) +
        "/auto/upload";


        const formData =
        new FormData();


        formData.append(
            "file",
            file
        );


        formData.append(
            "upload_preset",
            CLOUDINARY_UPLOAD_PRESET
        );


        const result =
        await new Promise(
            (resolve,reject)=>{

                const xhr =
                new XMLHttpRequest();


                xhr.open(
                    "POST",
                    uploadUrl
                );


                xhr.upload.onprogress =
                function(event){

                    if(
                        event.lengthComputable
                    ){

                        const percent =
                        Math.round(
                            event.loaded /
                            event.total *
                            100
                        );


                        progressBar.style.width =
                        percent + "%";

                    }

                };


                xhr.onload =
                function(){

                    if(
                        xhr.status >= 200 &&
                        xhr.status < 300
                    ){

                        try{

                            resolve(
                                JSON.parse(
                                    xhr.responseText
                                )
                            );

                        }catch(error){

                            reject(
                                new Error(
                                    "Invalid Cloudinary response."
                                )
                            );

                        }

                    }else{

                        let message =
                        "Cloudinary upload failed.";


                        try{

                            const data =
                            JSON.parse(
                                xhr.responseText
                            );


                            if(
                                data.error &&
                                data.error.message
                            ){

                                message =
                                data.error.message;

                            }

                        }catch(e){}


                        reject(
                            new Error(
                                message
                            )
                        );

                    }

                };


                xhr.onerror =
                function(){

                    reject(
                        new Error(
                            "Could not connect to Cloudinary."
                        )
                    );

                };


                xhr.send(
                    formData
                );

            }
        );


        if(
            !result.secure_url
        ){

            throw new Error(
                "Cloudinary did not return a media URL."
            );

        }


        showStatus(
            "Cloudinary upload successful. Saving URL to Firebase..."
        );


        /*
         IMPORTANT FIRESTORE DOCUMENT
        */

        const saved =
        await addDoc(

            collection(
                db,
                COLLECTION_NAME
            ),

            {

                name:
                name,

                type:
                type,

                url:
                result.secure_url,

                publicId:
                result.public_id || "",

                createdAt:
                serverTimestamp()

            }

        );


        console.log(
            "Firebase document created:",
            saved.id
        );


        showStatus(
            "✓ Upload successful. Media is now saved in Firebase.",
            "ok"
        );


        document.getElementById(
            "mediaName"
        ).value = "";


        document.getElementById(
            "mediaFile"
        ).value = "";


        document.getElementById(
            "fileName"
        ).textContent =
        "No file selected";


        progressBar.style.width =
        "100%";


        await loadMedia();


    }catch(error){

        console.error(
            "Upload error:",
            error
        );


        showStatus(
            "❌ " + error.message,
            "error"
        );

    }finally{

        button.disabled =
        false;

    }

};


/* =====================================================
   STATUS
===================================================== */

function showStatus(
    message,
    type=""
){

    const element =
    document.getElementById(
        "status"
    );


    element.textContent =
    message;


    element.className =
    "status";


    if(type){

        element.classList.add(
            type
        );

    }

}


/* =====================================================
   LOAD FIREBASE MEDIA
===================================================== */

async function loadMedia(){

    const list =
    document.getElementById(
        "mediaList"
    );


    try{

        const snapshot =
        await getDocs(
            collection(
                db,
                COLLECTION_NAME
            )
        );


        list.innerHTML =
        "";


        if(
            snapshot.empty
        ){

            list.innerHTML =
            '<div class="empty">No media uploaded yet.</div>';

            return;

        }


        snapshot.forEach(
            item=>{

                const data =
                item.data();


                if(
                    !data.url
                ){

                    return;

                }


                const row =
                document.createElement(
                    "div"
                );


                row.className =
                "media-item";


                let preview;


                if(
                    data.type ===
                    "video"
                ){

                    preview =
                    document.createElement(
                        "video"
                    );

                    preview.src =
                    data.url;

                    preview.muted =
                    true;

                    preview.preload =
                    "metadata";

                }else{

                    preview =
                    document.createElement(
                        "img"
                    );

                    preview.src =
                    data.url;

                }


                preview.className =
                "media-preview";


                const info =
                document.createElement(
                    "div"
                );


                info.className =
                "media-info";


                const title =
                document.createElement(
                    "strong"
                );


                title.textContent =
                data.name ||
                "Project Media";


                const url =
                document.createElement(
                    "small"
                );


                url.textContent =
                data.url;


                info.appendChild(
                    title
                );

                info.appendChild(
                    url
                );


                const deleteButton =
                document.createElement(
                    "button"
                );


                deleteButton.className =
                "delete";


                deleteButton.textContent =
                "Delete";


                deleteButton.onclick =
                function(){

                    deleteMedia(
                        item.id
                    );

                };


                row.appendChild(
                    preview
                );

                row.appendChild(
                    info
                );

                row.appendChild(
                    deleteButton
                );


                list.appendChild(
                    row
                );

            }
        );

    }catch(error){

        console.error(
            error
        );


        list.innerHTML =
        '<div class="empty">❌ Could not load Firebase media.</div>';

    }

}


/* =====================================================
   DELETE FIRESTORE DOCUMENT
===================================================== */

async function deleteMedia(
    id
){

    if(
        !confirm(
            "Delete this media from the website?"
        )
    ){

        return;

    }


    try{

        await deleteDoc(
            doc(
                db,
                COLLECTION_NAME,
                id
            )
        );


        showStatus(
            "✓ Media removed from Firebase.",
            "ok"
        );


        await loadMedia();

    }catch(error){

        console.error(
            error
        );


        showStatus(
            "❌ Delete failed: " +
            error.message,
            "error"
        );

    }

}


/* =====================================================
   FIRST LOAD
===================================================== */

loadMedia();

</script>

</body>
</html>
