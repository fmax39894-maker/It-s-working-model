<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width,initial-scale=1.0"
>

<title>Heart Editor</title>

<script src="cloudinary-config.js"></script>

<script src="cloudinary-upload.js"></script>

<style>

*{
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    margin:0;
    background:#08090b;
    color:#f5f5f5;
    font-family:
        Arial,
        Helvetica,
        sans-serif;
}

.container{
    width:100%;
    max-width:900px;
    margin:auto;
    padding:20px;
}

.header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:15px;
    margin-bottom:30px;
}

.logo{
    font-size:34px;
    font-weight:800;
}

.logo span{
    color:#ff2438;
}

.website-btn{
    border:1px solid #303238;
    background:#111216;
    color:white;
    border-radius:18px;
    padding:16px 22px;
    font-size:18px;
    cursor:pointer;
}

.card{
    background:#111216;
    border:1px solid #292c32;
    border-radius:28px;
    padding:30px;
    margin-bottom:28px;
    box-shadow:
        0 10px 35px rgba(0,0,0,.25);
}

.card-title{
    color:#ff263a;
    font-size:30px;
    font-weight:800;
    margin:0 0 25px;
}

.status-box{
    background:#090a0d;
    border:1px solid #292c32;
    border-radius:18px;
    padding:18px;
    margin-bottom:15px;
    font-size:18px;
    color:#c8c8c8;
    line-height:1.5;
}

.status-ok{
    color:#58df79;
}

.status-error{
    color:#ff5968;
}

.status-loading{
    color:#d0d0d0;
}

label{
    display:block;
    font-size:18px;
    color:#bdbdc2;
    margin:20px 0 9px;
}

input,
select{
    width:100%;
    padding:18px;
    border-radius:16px;
    border:1px solid #303238;
    background:#08090b;
    color:white;
    font-size:18px;
    outline:none;
}

input:focus,
select:focus{
    border-color:#ff263a;
}

.file-box{
    border:1px dashed #383b42;
    border-radius:18px;
    padding:22px;
    background:#090a0d;
}

input[type="file"]{
    padding:10px;
}

.primary-btn{
    margin-top:25px;
    padding:17px 28px;
    border:0;
    border-radius:16px;
    background:#ff263a;
    color:white;
    font-size:18px;
    font-weight:700;
    cursor:pointer;
}

.primary-btn:disabled{
    opacity:.5;
    cursor:not-allowed;
}

.progress-wrap{
    display:none;
    margin-top:20px;
}

.progress{
    height:10px;
    width:100%;
    background:#24262b;
    border-radius:20px;
    overflow:hidden;
}

.progress-bar{
    height:100%;
    width:0%;
    background:#ff263a;
    transition:.2s;
}

.progress-text{
    margin-top:8px;
    color:#aaa;
}

.description{
    color:#92949a;
    font-size:16px;
    line-height:1.6;
    margin-top:25px;
}

.media-list{
    display:flex;
    flex-direction:column;
    gap:15px;
}

.media-item{
    background:#090a0d;
    border:1px solid #292c32;
    border-radius:18px;
    padding:18px;
}

.media-name{
    font-size:19px;
    font-weight:700;
    margin-bottom:8px;
}

.media-type{
    color:#ff4052;
    font-size:14px;
    margin-bottom:12px;
}

.media-url{
    width:100%;
    background:#111216;
    border:1px solid #292c32;
    padding:12px;
    border-radius:10px;
    color:#aaa;
    font-size:13px;
    word-break:break-all;
}

.media-actions{
    display:flex;
    gap:10px;
    margin-top:12px;
}

.small-btn{
    padding:11px 16px;
    border-radius:10px;
    border:1px solid #33363d;
    background:#16181d;
    color:white;
    cursor:pointer;
}

.delete-btn{
    background:#421319;
    border-color:#70202b;
    color:#ff6c7b;
}

.empty{
    color:#888;
    text-align:center;
    padding:25px;
}

.notice{
    display:none;
    margin-top:20px;
    padding:15px;
    border-radius:14px;
    background:#17191d;
    border:1px solid #303238;
    line-height:1.5;
}

@media(max-width:600px){

    .container{
        padding:16px;
    }

    .header{
        align-items:flex-start;
    }

    .logo{
        font-size:29px;
    }

    .website-btn{
        padding:13px 16px;
        font-size:16px;
    }

    .card{
        padding:22px;
        border-radius:23px;
    }

    .card-title{
        font-size:27px;
    }

}

</style>

</head>

<body>

<div class="container">

    <!-- HEADER -->

    <div class="header">

        <div class="logo">
            Heart <span>Editor</span>
        </div>

        <button
            class="website-btn"
            onclick="goWebsite()"
        >
            ← Website
        </button>

    </div>


    <!-- STATUS -->

    <section class="card">

        <h2 class="card-title">
            System Status
        </h2>

        <div
            id="firebaseStatus"
            class="status-box status-loading"
        >
            🔄 Connecting to Firebase...
        </div>

        <div
            id="cloudinaryStatus"
            class="status-box status-loading"
        >
            ☁️ Checking Cloudinary...
        </div>

    </section>


    <!-- ADD MEDIA -->

    <section class="card">

        <h2 class="card-title">
            Add Project Media
        </h2>


        <label for="mediaName">
            Media Name
        </label>

        <input
            id="mediaName"
            type="text"
            placeholder="Example: Heart Model"
        >


        <label for="mediaType">
            Media Type
        </label>

        <select id="mediaType">

            <option value="image">
                📸 Photo
            </option>

            <option value="video">
                🎬 Video
            </option>

        </select>


        <label for="mediaFile">
            Select Image / Video
        </label>

        <div class="file-box">

            <input
                id="mediaFile"
                type="file"
                accept="image/*,video/*"
            >

        </div>


        <button
            id="uploadBtn"
            class="primary-btn"
        >
            Upload Media
        </button>


        <div
            id="progressWrap"
            class="progress-wrap"
        >

            <div class="progress">

                <div
                    id="progressBar"
                    class="progress-bar"
                ></div>

            </div>

            <div
                id="progressText"
                class="progress-text"
            >
                Uploading 0%
            </div>

        </div>


        <div
            id="notice"
            class="notice"
        ></div>


        <div class="description">

            The selected file is uploaded to Cloudinary.
            Only its URL and information are saved in
            Firebase Firestore.

        </div>

    </section>


    <!-- EXISTING MEDIA -->

    <section class="card">

        <h2 class="card-title">
            Project Media
        </h2>

        <div
            id="mediaList"
            class="media-list"
        >

            <div class="empty">
                Loading media...
            </div>

        </div>

    </section>

</div>


<!-- =====================================================
     CLOUDINARY UPLOAD SCRIPT

     IMPORTANT:
     YOUR ACTUAL FILE NAME IS:

     cloudinary-upload.js

     NOT cloudinary-uploads.js
===================================================== -->

<script src="./cloudinary-upload.js"></script>


<!-- =====================================================
     FIREBASE
===================================================== -->

<script type="module">

import {
    db
} from "./firebase-config.js";

import {
    collection,
    addDoc,
    getDocs,
    deleteDoc,
    doc,
    serverTimestamp,
    orderBy,
    query
} from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


/* =====================================================
   FIREBASE COLLECTION

   Keep this the SAME collection that index.html uses.
===================================================== */

const COLLECTION_NAME = "media";


/* =====================================================
   ELEMENTS
===================================================== */

const firebaseStatus =
    document.getElementById(
        "firebaseStatus"
    );

const cloudinaryStatus =
    document.getElementById(
        "cloudinaryStatus"
    );

const mediaName =
    document.getElementById(
        "mediaName"
    );

const mediaType =
    document.getElementById(
        "mediaType"
    );

const mediaFile =
    document.getElementById(
        "mediaFile"
    );

const uploadBtn =
    document.getElementById(
        "uploadBtn"
    );

const mediaList =
    document.getElementById(
        "mediaList"
    );

const progressWrap =
    document.getElementById(
        "progressWrap"
    );

const progressBar =
    document.getElementById(
        "progressBar"
    );

const progressText =
    document.getElementById(
        "progressText"
    );

const notice =
    document.getElementById(
        "notice"
    );


/* =====================================================
   FIREBASE STATUS

   Importing firebase-config.js successfully means
   Firebase has initialized.
===================================================== */

firebaseStatus.textContent =
    "✅ Firebase connected";

firebaseStatus.className =
    "status-box status-ok";


/* =====================================================
   CHECK CLOUDINARY SCRIPT
===================================================== */

if(
    typeof window.uploadToCloudinary ===
    "function"
){

    cloudinaryStatus.textContent =
        "✅ Cloudinary uploader loaded";

    cloudinaryStatus.className =
        "status-box status-ok";

}else{

    cloudinaryStatus.textContent =
        "❌ cloudinary-upload.js did not load";

    cloudinaryStatus.className =
        "status-box status-error";

    uploadBtn.disabled = true;

}


/* =====================================================
   LOAD EXISTING MEDIA
===================================================== */

async function loadMedia(){

    mediaList.innerHTML =
        `<div class="empty">
            Loading media...
        </div>`;

    try{

        const mediaQuery =
            query(
                collection(
                    db,
                    COLLECTION_NAME
                ),
                orderBy(
                    "createdAt",
                    "desc"
                )
            );


        const snapshot =
            await getDocs(
                mediaQuery
            );


        if(snapshot.empty){

            mediaList.innerHTML =
                `<div class="empty">
                    No media uploaded yet.
                </div>`;

            return;

        }


        mediaList.innerHTML = "";


        snapshot.forEach(
            item => {

                const data =
                    item.data();

                createMediaItem(
                    item.id,
                    data
                );

            }
        );

    }catch(error){

        console.error(
            "Firebase media error:",
            error
        );


        mediaList.innerHTML =
            `<div class="empty">
                ❌ Could not load media.<br><br>
                ${escapeHtml(
                    error.message
                )}
            </div>`;

    }

}


/* =====================================================
   CREATE MEDIA ITEM
===================================================== */

function createMediaItem(
    id,
    data
){

    const item =
        document.createElement(
            "div"
        );

    item.className =
        "media-item";


    const name =
        data.name ||
        "Unnamed Media";


    const type =
        data.type ||
        "image";


    const url =
        data.url ||
        "";


    item.innerHTML = `

        <div class="media-name">
            ${escapeHtml(name)}
        </div>

        <div class="media-type">
            ${
                type === "video"
                ? "🎬 VIDEO"
                : "📸 PHOTO"
            }
        </div>

        <div class="media-url">
            ${escapeHtml(url)}
        </div>

        <div class="media-actions">

            <button
                class="small-btn"
                data-copy="${escapeHtml(url)}"
            >
                Copy URL
            </button>

            <button
                class="small-btn delete-btn"
                data-delete="${id}"
            >
                Delete
            </button>

        </div>
    `;


    const copyBtn =
        item.querySelector(
            "[data-copy]"
        );


    copyBtn.addEventListener(
        "click",
        async () => {

            try{

                await navigator.clipboard.writeText(
                    url
                );

                copyBtn.textContent =
                    "✓ Copied";

                setTimeout(
                    () => {
                        copyBtn.textContent =
                            "Copy URL";
                    },
                    1500
                );

            }catch(error){

                alert(
                    "Could not copy URL."
                );

            }

        }
    );


    const deleteBtn =
        item.querySelector(
            "[data-delete]"
        );


    deleteBtn.addEventListener(
        "click",
        () => {

            deleteMedia(
                id
            );

        }
    );


    mediaList.appendChild(
        item
    );

}


/* =====================================================
   UPLOAD
===================================================== */

uploadBtn.addEventListener(
    "click",
    async () => {

        const name =
            mediaName.value.trim();

        const file =
            mediaFile.files[0];

        const type =
            mediaType.value;


        if(!name){

            showNotice(
                "❌ Please enter a media name.",
                true
            );

            return;

        }


        if(!file){

            showNotice(
                "❌ Please select an image or video.",
                true
            );

            return;

        }


        /* Validate selected file */

        if(
            type === "image" &&
            !file.type.startsWith(
                "image/"
            )
        ){

            showNotice(
                "❌ Please select an image.",
                true
            );

            return;

        }


        if(
            type === "video" &&
            !file.type.startsWith(
                "video/"
            )
        ){

            showNotice(
                "❌ Please select a video.",
                true
            );

            return;

        }


        if(
            typeof window.uploadToCloudinary !==
            "function"
        ){

            showNotice(
                "❌ Cloudinary uploader is not available. Check cloudinary-upload.js.",
                true
            );

            return;

        }


        uploadBtn.disabled = true;

        progressWrap.style.display =
            "block";

        progressBar.style.width =
            "0%";

        progressText.textContent =
            "Uploading 0%";


        try{

            /* =========================================
               CLOUDINARY UPLOAD
            ========================================= */

            const result =
                await window.uploadToCloudinary(
                    file,
                    percent => {

                        progressBar.style.width =
                            percent + "%";

                        progressText.textContent =
                            "Uploading " +
                            percent +
                            "%";

                    }
                );


            const url =
                window.getCloudinaryUrl
                ? window.getCloudinaryUrl(
                    result
                )
                : result.secure_url;


            if(!url){

                throw new Error(
                    "Cloudinary did not return a URL."
                );

            }


            progressBar.style.width =
                "100%";

            progressText.textContent =
                "Upload complete";


            /* =========================================
               SAVE TO FIRESTORE
            ========================================= */

            await addDoc(
                collection(
                    db,
                    COLLECTION_NAME
                ),
                {

                    name: name,

                    type: type,

                    url: url,

                    publicId:
                        result.public_id ||
                        "",

                    resourceType:
                        result.resource_type ||
                        "",

                    format:
                        result.format ||
                        "",

                    createdAt:
                        serverTimestamp()

                }
            );


            showNotice(
                "✅ Media uploaded successfully and saved to Firebase.",
                false
            );


            /* Clear form */

            mediaName.value =
                "";

            mediaFile.value =
                "";


            await loadMedia();


        }catch(error){

            console.error(
                "Upload error:",
                error
            );


            showNotice(
                "❌ " +
                error.message,
                true
            );

        }finally{

            uploadBtn.disabled =
                false;

        }

    }
);


/* =====================================================
   DELETE MEDIA
===================================================== */

async function deleteMedia(
    id
){

    const confirmed =
        confirm(
            "Delete this media link from Firebase?"
        );


    if(!confirmed){

        return;

    }


    try{

        await deleteDoc(
            doc(
                db,
                COLLECTION_NAME,
                id
            )
        );


        await loadMedia();


        showNotice(
            "✅ Media removed from Firebase.",
            false
        );


    }catch(error){

        console.error(
            error
        );


        showNotice(
            "❌ Delete failed: " +
            error.message,
            true
        );

    }

}


/* =====================================================
   NOTICE
===================================================== */

function showNotice(
    message,
    isError
){

    notice.style.display =
        "block";

    notice.textContent =
        message;

    notice.style.color =
        isError
        ? "#ff6978"
        : "#62e27d";

}


/* =====================================================
   HTML ESCAPE
===================================================== */

function escapeHtml(
    value
){

    return String(
        value
    )
    .replace(
        /&/g,
        "&amp;"
    )
    .replace(
        /</g,
        "&lt;"
    )
    .replace(
        />/g,
        "&gt;"
    )
    .replace(
        /"/g,
        "&quot;"
    )
    .replace(
        /'/g,
        "&#039;"
    );

}


/* =====================================================
   INITIAL LOAD
===================================================== */

loadMedia();


/* =====================================================
   WEBSITE BUTTON
===================================================== */

window.goWebsite =
    function(){

        window.location.href =
            "index.html";

    };

</script>

</body>
</html>
