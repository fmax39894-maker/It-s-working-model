<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width,initial-scale=1.0"
>

<title>Heart Editor</title>


<style>

*{
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{

    margin:0;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    background:#08090b;

    color:#f5f5f5;

    min-height:100vh;
}


.container{

    width:100%;

    max-width:900px;

    margin:auto;

    padding:25px 20px 60px;
}


/* =========================================
   HEADER
========================================= */

.header{

    display:flex;

    justify-content:space-between;

    align-items:center;

    gap:15px;

    margin-bottom:35px;
}


.header h1{

    margin:0;

    font-size:40px;

    font-weight:800;
}


.header h1 span{

    color:#ff2438;
}


.website-btn{

    border:1px solid #303238;

    background:#15171b;

    color:white;

    padding:15px 25px;

    border-radius:18px;

    font-size:18px;

    text-decoration:none;

    white-space:nowrap;

}


.website-btn:active{

    transform:scale(.97);
}


/* =========================================
   CARD
========================================= */

.card{

    background:#121419;

    border:1px solid #2b2e34;

    border-radius:28px;

    padding:30px;

    margin-bottom:25px;

    box-shadow:
        0 10px 30px rgba(0,0,0,.25);
}


.card h2{

    margin:0 0 25px;

    color:#ff2438;

    font-size:30px;
}


/* =========================================
   STATUS
========================================= */

.status-box{

    background:#090a0d;

    border:1px solid #292c31;

    border-radius:18px;

    padding:20px;

    margin-bottom:15px;

    font-size:19px;

    color:#bbb;
}


.status-ok{

    color:#66e681;
}


.status-error{

    color:#ff5262;
}


.status-loading{

    color:#ddd;
}


/* =========================================
   FORM
========================================= */

label{

    display:block;

    margin-top:20px;

    margin-bottom:9px;

    font-size:17px;

    color:#bdbdc2;
}


input,
select{

    width:100%;

    padding:17px;

    border-radius:16px;

    border:1px solid #303239;

    background:#08090b;

    color:white;

    font-size:17px;

    outline:none;
}


input:focus,
select:focus{

    border-color:#ff2438;
}


input[type="file"]{

    padding:15px;

    cursor:pointer;
}


.upload-btn{

    margin-top:25px;

    border:0;

    background:#ff2438;

    color:white;

    padding:16px 28px;

    border-radius:16px;

    font-size:18px;

    font-weight:700;

    cursor:pointer;
}


.upload-btn:disabled{

    opacity:.5;

    cursor:not-allowed;
}


.progress-wrap{

    display:none;

    margin-top:20px;
}


.progress{

    width:100%;

    height:10px;

    background:#27292e;

    border-radius:20px;

    overflow:hidden;
}


.progress-bar{

    width:0%;

    height:100%;

    background:#ff2438;

    transition:width .2s;
}


.progress-text{

    margin-top:8px;

    color:#aaa;

    font-size:14px;
}


.message{

    margin-top:18px;

    padding:15px;

    border-radius:14px;

    display:none;

    line-height:1.5;
}


.message.success{

    display:block;

    background:#102518;

    color:#72e58b;

    border:1px solid #235d32;
}


.message.error{

    display:block;

    background:#2a1014;

    color:#ff7180;

    border:1px solid #6b2029;
}


/* =========================================
   MEDIA LIST
========================================= */

.media-list{

    display:grid;

    grid-template-columns:
        repeat(auto-fit,minmax(240px,1fr));

    gap:20px;
}


.media-item{

    background:#090a0d;

    border:1px solid #2c2f35;

    border-radius:20px;

    overflow:hidden;
}


.media-preview{

    width:100%;

    height:180px;

    background:#050608;

    display:flex;

    align-items:center;

    justify-content:center;

    overflow:hidden;
}


.media-preview img,
.media-preview video{

    width:100%;

    height:100%;

    object-fit:cover;
}


.video-placeholder{

    font-size:45px;
}


.media-info{

    padding:17px;
}


.media-name{

    font-size:18px;

    font-weight:700;

    margin-bottom:7px;

    word-break:break-word;
}


.media-type{

    color:#aaa;

    font-size:14px;

    margin-bottom:15px;
}


.url-box{

    width:100%;

    background:#111318;

    border:1px solid #292c31;

    padding:10px;

    border-radius:10px;

    font-size:12px;

    color:#aaa;

    word-break:break-all;

    margin-bottom:12px;
}


.delete-btn{

    width:100%;

    border:1px solid #7b2630;

    background:#281014;

    color:#ff6573;

    padding:12px;

    border-radius:12px;

    font-size:15px;

    cursor:pointer;
}


.delete-btn:active{

    transform:scale(.98);
}


.empty{

    text-align:center;

    color:#888;

    padding:30px 10px;
}


/* =========================================
   RESPONSIVE
========================================= */

@media(max-width:600px){

    .container{

        padding:20px 16px 50px;
    }


    .header{

        align-items:flex-start;
    }


    .header h1{

        font-size:32px;
    }


    .website-btn{

        padding:13px 17px;

        font-size:16px;
    }


    .card{

        padding:22px;

        border-radius:24px;
    }


    .card h2{

        font-size:27px;
    }

}

</style>

</head>


<body>


<div class="container">


    <!-- =====================================
         HEADER
    ====================================== -->

    <header class="header">

        <h1>
            Heart <span>Editor</span>
        </h1>

        <a
            href="index.html"
            class="website-btn"
        >
            ← Website
        </a>

    </header>



    <!-- =====================================
         SYSTEM STATUS
    ====================================== -->

    <section class="card">

        <h2>
            System Status
        </h2>


        <div
            id="firebaseStatus"
            class="status-box status-loading"
        >
            🔄 Connecting to Firebase...
        </div>


        <div
            id="cloudinaryStatus"
            class="status-box status-loading"
        >
            ☁️ Checking Cloudinary...
        </div>

    </section>



    <!-- =====================================
         ADD MEDIA
    ====================================== -->

    <section class="card">

        <h2>
            Add Project Media
        </h2>


        <label for="mediaName">
            Media Name
        </label>

        <input
            id="mediaName"
            type="text"
            placeholder="Example: Heart Model"
        >


        <label for="mediaType">
            Media Type
        </label>

        <select id="mediaType">

            <option value="image">
                📸 Photo
            </option>

            <option value="video">
                🎬 Video
            </option>

        </select>


        <label for="mediaFile">
            Select Image / Video
        </label>

        <input
            id="mediaFile"
            type="file"
            accept="image/*,video/*"
        >


        <button
            id="uploadBtn"
            class="upload-btn"
        >
            Upload Media
        </button>


        <div
            id="progressWrap"
            class="progress-wrap"
        >

            <div class="progress">

                <div
                    id="progressBar"
                    class="progress-bar"
                ></div>

            </div>

            <div
                id="progressText"
                class="progress-text"
            >
                0%
            </div>

        </div>


        <div
            id="message"
            class="message"
        ></div>


        <p
            style="
                color:#888;
                line-height:1.6;
                margin-top:30px;
            "
        >
            The selected file is uploaded to Cloudinary.
            Only its URL and information are saved in
            Firebase Firestore.
        </p>

    </section>



    <!-- =====================================
         EXISTING MEDIA
    ====================================== -->

    <section class="card">

        <h2>
            Existing Project Media
        </h2>


        <div
            id="mediaList"
            class="media-list"
        >

            <div class="empty">
                Loading media...
            </div>

        </div>

    </section>


</div>



<!-- =========================================
     CLOUDINARY
========================================= -->

<script src="cloudinary-config.js"></script>

<script src="cloudinary-uploads.js"></script>



<!-- =========================================
     FIREBASE / EDITOR
========================================= -->

<script type="module">

"use strict";


/*
=========================================================
        FIREBASE IMPORT
=========================================================
*/

import {

    collection,
    addDoc,
    getDocs,
    deleteDoc,
    doc,
    orderBy,
    query,
    serverTimestamp

} from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


import {

    db

} from "./firebase-config.js";



/*
=========================================================
        IMPORTANT
=========================================================
*/

const COLLECTION_NAME = "media";



/*
=========================================================
        ELEMENTS
=========================================================
*/

const firebaseStatus =
    document.getElementById(
        "firebaseStatus"
    );


const cloudinaryStatus =
    document.getElementById(
        "cloudinaryStatus"
    );


const mediaName =
    document.getElementById(
        "mediaName"
    );


const mediaType =
    document.getElementById(
        "mediaType"
    );


const mediaFile =
    document.getElementById(
        "mediaFile"
    );


const uploadBtn =
    document.getElementById(
        "uploadBtn"
    );


const progressWrap =
    document.getElementById(
        "progressWrap"
    );


const progressBar =
    document.getElementById(
        "progressBar"
    );


const progressText =
    document.getElementById(
        "progressText"
    );


const message =
    document.getElementById(
        "message"
    );


const mediaList =
    document.getElementById(
        "mediaList"
    );



/*
=========================================================
        FIREBASE STATUS
=========================================================
*/

firebaseStatus.textContent =
    "✓ Firebase connected";


firebaseStatus.className =
    "status-box status-ok";



/*
=========================================================
        CLOUDINARY STATUS
=========================================================
*/

if(
    typeof window.uploadToCloudinary ===
    "function"
){

    cloudinaryStatus.textContent =
        "✓ Cloudinary ready";


    cloudinaryStatus.className =
        "status-box status-ok";

}else{

    cloudinaryStatus.textContent =
        "❌ Cloudinary upload script not loaded";


    cloudinaryStatus.className =
        "status-box status-error";

}



/*
=========================================================
        MESSAGE
=========================================================
*/

function showMessage(
    text,
    type
){

    message.textContent =
        text;

    message.className =
        "message " + type;

}



/*
=========================================================
        LOAD MEDIA
=========================================================
*/

async function loadMedia(){

    mediaList.innerHTML =
        `<div class="empty">
            Loading media...
        </div>`;


    try{

        const mediaRef =
            collection(
                db,
                COLLECTION_NAME
            );


        const mediaQuery =
            query(
                mediaRef,
                orderBy(
                    "createdAt",
                    "desc"
                )
            );


        const snapshot =
            await getDocs(
                mediaQuery
            );


        if(
            snapshot.empty
        ){

            mediaList.innerHTML =
                `<div class="empty">
                    No media uploaded yet.
                </div>`;

            return;

        }


        mediaList.innerHTML = "";


        snapshot.forEach(
            item => {

                const data =
                    item.data();


                createMediaCard(
                    item.id,
                    data
                );

            }
        );


    }catch(error){

        console.error(
            "Firebase media error:",
            error
        );


        /*
        If createdAt is missing from old
        documents, load without orderBy.
        */

        try{

            const fallback =
                await getDocs(
                    collection(
                        db,
                        COLLECTION_NAME
                    )
                );


            mediaList.innerHTML =
                "";


            if(
                fallback.empty
            ){

                mediaList.innerHTML =
                    `<div class="empty">
                        No media uploaded yet.
                    </div>`;

                return;

            }


            fallback.forEach(
                item => {

                    createMediaCard(
                        item.id,
                        item.data()
                    );

                }
            );


        }catch(secondError){

            console.error(
                secondError
            );


            mediaList.innerHTML =
                `<div class="empty"
                    style="color:#ff6573">
                    ❌ Could not load media.
                    <br><br>
                    ${escapeHtml(
                        secondError.message
                    )}
                </div>`;

        }

    }

}



/*
=========================================================
        CREATE MEDIA CARD
=========================================================
*/

function createMediaCard(
    id,
    data
){

    const card =
        document.createElement(
            "div"
        );


    card.className =
        "media-item";


    const name =
        data.name ||
        "Unnamed Media";


    const type =
        data.type ||
        "image";


    const url =
        data.url ||
        data.secure_url ||
        "";


    let preview = "";


    if(
        type === "video"
    ){

        preview = `

            <div class="media-preview">

                <video
                    src="${escapeAttribute(url)}"
                    controls
                    preload="metadata"
                ></video>

            </div>

        `;

    }else{

        preview = `

            <div class="media-preview">

                <img
                    src="${escapeAttribute(url)}"
                    alt="${escapeAttribute(name)}"
                    loading="lazy"
                >

            </div>

        `;

    }


    card.innerHTML = `

        ${preview}

        <div class="media-info">

            <div class="media-name">
                ${escapeHtml(name)}
            </div>

            <div class="media-type">
                ${type === "video"
                    ? "🎬 Video"
                    : "📸 Photo"}
            </div>

            <div class="url-box">
                ${escapeHtml(url)}
            </div>

            <button
                class="delete-btn"
                data-id="${escapeAttribute(id)}"
            >
                🗑 Delete
            </button>

        </div>

    `;


    const deleteButton =
        card.querySelector(
            ".delete-btn"
        );


    deleteButton.addEventListener(
        "click",
        async () => {

            await deleteMedia(
                id,
                card
            );

        }
    );


    mediaList.appendChild(
        card
    );

}



/*
=========================================================
        DELETE MEDIA
=========================================================
*/

async function deleteMedia(
    id,
    card
){

    const confirmed =
        confirm(
            "Delete this media from the project?"
        );


    if(!confirmed){

        return;

    }


    try{

        await deleteDoc(
            doc(
                db,
                COLLECTION_NAME,
                id
            )
        );


        card.remove();


        showMessage(
            "✓ Media deleted successfully.",
            "success"
        );


        if(
            !mediaList.children.length
        ){

            mediaList.innerHTML =
                `<div class="empty">
                    No media uploaded yet.
                </div>`;

        }


    }catch(error){

        console.error(
            error
        );


        showMessage(
            "❌ Delete failed: " +
            error.message,
            "error"
        );

    }

}



/*
=========================================================
        UPLOAD
=========================================================
*/

uploadBtn.addEventListener(
    "click",
    async () => {

        const name =
            mediaName.value.trim();


        const type =
            mediaType.value;


        const file =
            mediaFile.files[0];


        if(!name){

            showMessage(
                "Please enter a media name.",
                "error"
            );

            return;

        }


        if(!file){

            showMessage(
                "Please select an image or video.",
                "error"
            );

            return;

        }


        if(
            type === "image" &&
            !file.type.startsWith(
                "image/"
            )
        ){

            showMessage(
                "Please select an image file.",
                "error"
            );

            return;

        }


        if(
            type === "video" &&
            !file.type.startsWith(
                "video/"
            )
        ){

            showMessage(
                "Please select a video file.",
                "error"
            );

            return;

        }


        if(
            typeof window.uploadToCloudinary !==
            "function"
        ){

            showMessage(
                "Cloudinary upload function is not available. Check cloudinary-uploads.js.",
                "error"
            );

            return;

        }


        uploadBtn.disabled =
            true;


        progressWrap.style.display =
            "block";


        progressBar.style.width =
            "0%";


        progressText.textContent =
            "Uploading: 0%";


        message.className =
            "message";


        try{

            /*
            =========================================
              CLOUDINARY UPLOAD
            =========================================
            */

            const result =
                await window.uploadToCloudinary(

                    file,

                    percent => {

                        progressBar.style.width =
                            percent + "%";


                        progressText.textContent =
                            "Uploading: " +
                            percent +
                            "%";

                    }

                );


            const url =
                window.getCloudinaryUrl
                    ? window.getCloudinaryUrl(result)
                    : result.secure_url;


            if(!url){

                throw new Error(
                    "Cloudinary did not return a URL."
                );

            }



            /*
            =========================================
              FIRESTORE SAVE
            =========================================
            */

            await addDoc(

                collection(
                    db,
                    COLLECTION_NAME
                ),

                {

                    name:
                        name,

                    type:
                        type,

                    url:
                        url,

                    cloudinaryPublicId:
                        result.public_id ||
                        "",

                    format:
                        result.format ||
                        "",

                    resourceType:
                        result.resource_type ||
                        "",

                    createdAt:
                        serverTimestamp()

                }

            );


            progressBar.style.width =
                "100%";


            progressText.textContent =
                "Upload complete";


            showMessage(
                "✓ Media uploaded successfully and saved to Firebase.",
                "success"
            );


            mediaName.value =
                "";


            mediaFile.value =
                "";


            await loadMedia();


        }catch(error){

            console.error(
                "Upload error:",
                error
            );


            showMessage(
                "❌ Upload failed: " +
                error.message,
                "error"
            );

        }


        uploadBtn.disabled =
            false;

    }
);



/*
=========================================================
        HTML SECURITY HELPERS
=========================================================
*/

function escapeHtml(
    value
){

    return String(value)
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );

}


function escapeAttribute(
    value
){

    return escapeHtml(
        value
    );

}



/*
=========================================================
        START
=========================================================
*/

loadMedia();

</script>


</body>

</html>
