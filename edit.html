<!doctype html>
<html lang="en">

<head>

<meta charset="utf-8">

<meta
    name="viewport"
    content="width=device-width,initial-scale=1"
>

<title>Heart Project Editor</title>

<style>

*{
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    margin:0;
    min-height:100vh;
    background:#08090b;
    color:#fff;
    font-family:Arial,sans-serif;
}

.container{
    width:min(1000px,92%);
    margin:auto;
    padding:30px 0 60px;
}

.header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:15px;
    margin-bottom:25px;
}

.header h1{
    margin:0;
    font-size:28px;
}

.header h1 span{
    color:#ff2638;
}

.back-btn{
    border:1px solid #34363c;
    background:#111317;
    color:#fff;
    padding:10px 15px;
    border-radius:9px;
    text-decoration:none;
}

.card{
    background:#111317;
    border:1px solid #34363c;
    border-radius:16px;
    padding:22px;
    margin-bottom:20px;
}

.card h2{
    margin:0 0 16px;
    color:#ff2638;
    font-size:19px;
}

.status{
    padding:13px;
    border-radius:10px;
    background:#0c0d10;
    border:1px solid #34363c;
    color:#aaa;
    font-size:13px;
    line-height:1.5;
}

.status.ok{
    border-color:#285d38;
    color:#69e58a;
}

.status.error{
    border-color:#7a2730;
    color:#ff6875;
}

label{
    display:block;
    color:#aaa;
    font-size:12px;
    margin-bottom:7px;
}

input,
select{
    width:100%;
    padding:13px;
    border:1px solid #383a40;
    border-radius:9px;
    background:#08090b;
    color:#fff;
    outline:none;
    margin-bottom:15px;
}

input:focus,
select:focus{
    border-color:#ff2638;
}

.file-box{
    border:1px dashed #4a4c53;
    border-radius:12px;
    padding:22px;
    text-align:center;
    background:#0c0d10;
    margin-bottom:15px;
}

.file-box input{
    margin:0;
    border:0;
    padding:0;
    background:none;
}

.btn{
    border:0;
    border-radius:9px;
    padding:12px 18px;
    background:#ff2638;
    color:#fff;
    font-weight:bold;
    cursor:pointer;
}

.btn:disabled{
    opacity:.5;
    cursor:not-allowed;
}

.btn.secondary{
    background:#202228;
    border:1px solid #3a3c42;
}

.progress{
    display:none;
    margin-top:15px;
}

.progress.show{
    display:block;
}

.progress-bar{
    width:100%;
    height:9px;
    background:#202228;
    border-radius:20px;
    overflow:hidden;
}

.progress-fill{
    width:0%;
    height:100%;
    background:#ff2638;
    transition:.2s;
}

.progress-text{
    margin-top:7px;
    color:#aaa;
    font-size:12px;
    text-align:center;
}

.message{
    min-height:20px;
    margin-top:12px;
    font-size:13px;
}

.message.error{
    color:#ff6875;
}

.message.ok{
    color:#69e58a;
}

.media-list{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
    gap:15px;
}

.media-card{
    background:#0c0d10;
    border:1px solid #34363c;
    border-radius:12px;
    overflow:hidden;
}

.media-preview{
    width:100%;
    height:140px;
    object-fit:cover;
    display:block;
    background:#050506;
}

.media-info{
    padding:12px;
}

.media-name{
    font-weight:bold;
    margin-bottom:5px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.media-type{
    color:#aaa;
    font-size:11px;
    margin-bottom:10px;
}

.delete-btn{
    width:100%;
    border:1px solid #6d2930;
    background:#241013;
    color:#ff6875;
    padding:9px;
    border-radius:8px;
    cursor:pointer;
}

.empty{
    text-align:center;
    color:#777;
    padding:30px;
}

.small{
    color:#777;
    font-size:11px;
    line-height:1.5;
    margin-top:10px;
}

@media(max-width:600px){

    .container{
        width:94%;
        padding-top:20px;
    }

    .header h1{
        font-size:22px;
    }

    .card{
        padding:17px;
    }

}

</style>

</head>


<body>

<div class="container">


<!-- =====================================================
     HEADER
===================================================== -->

<div class="header">

<h1>
    Heart <span>Editor</span>
</h1>

<a
    href="index.html"
    class="back-btn"
>
    ← Website
</a>

</div>


<!-- =====================================================
     FIREBASE STATUS
===================================================== -->

<div class="card">

<h2>
    System Status
</h2>

<div
    id="firebaseStatus"
    class="status"
>
    🔄 Connecting to Firebase...
</div>

<div
    id="cloudinaryStatus"
    class="status"
    style="margin-top:10px"
>
    ☁️ Checking Cloudinary...
</div>

</div>


<!-- =====================================================
     UPLOAD
===================================================== -->

<div class="card">

<h2>
    Add Project Media
</h2>


<label for="mediaName">
    Media Name
</label>

<input
    id="mediaName"
    type="text"
    placeholder="Example: Heart Model"
>


<label for="mediaType">
    Media Type
</label>

<select id="mediaType">

<option value="photo">
    📸 Photo
</option>

<option value="video">
    🎬 Video
</option>

</select>


<label>
    Select Image / Video
</label>

<div class="file-box">

<input
    id="mediaFile"
    type="file"
    accept="image/*,video/*"
>

</div>


<button
    id="uploadBtn"
    class="btn"
>
    Upload Media
</button>


<div
    id="progress"
    class="progress"
>

<div class="progress-bar">

<div
    id="progressFill"
    class="progress-fill"
></div>

</div>

<div
    id="progressText"
    class="progress-text"
>
    0%
</div>

</div>


<div
    id="uploadMessage"
    class="message"
></div>


<div class="small">

The selected file is uploaded to Cloudinary.
Only its URL and information are saved in
Firebase Firestore.

</div>

</div>


<!-- =====================================================
     MEDIA LIST
===================================================== -->

<div class="card">

<h2>
    Firebase Media
</h2>

<div
    id="mediaList"
    class="media-list"
></div>

<div
    id="emptyMessage"
    class="empty"
    style="display:none"
>
    No media found.
</div>

</div>


</div>


<!-- =====================================================
     FIREBASE + CLOUDINARY
===================================================== -->

<script type="module">


/* =====================================================
   IMPORT FIREBASE CONFIG
===================================================== */

import {
    db
} from "./firebase-config.js";


/* =====================================================
   FIRESTORE FUNCTIONS
===================================================== */

import {
    collection,
    addDoc,
    getDocs,
    deleteDoc,
    doc,
    orderBy,
    query,
    serverTimestamp
} from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


/* =====================================================
   CLOUDINARY UPLOAD FUNCTION
===================================================== */

import "./cloudinary-uploads.js";


/* =====================================================
   CONSTANTS
===================================================== */

const COLLECTION_NAME =
    "heartProjectMedia";


/* =====================================================
   ELEMENTS
===================================================== */

const firebaseStatus =
    document.getElementById(
        "firebaseStatus"
    );


const cloudinaryStatus =
    document.getElementById(
        "cloudinaryStatus"
    );


const mediaName =
    document.getElementById(
        "mediaName"
    );


const mediaType =
    document.getElementById(
        "mediaType"
    );


const mediaFile =
    document.getElementById(
        "mediaFile"
    );


const uploadBtn =
    document.getElementById(
        "uploadBtn"
    );


const uploadMessage =
    document.getElementById(
        "uploadMessage"
    );


const progress =
    document.getElementById(
        "progress"
    );


const progressFill =
    document.getElementById(
        "progressFill"
    );


const progressText =
    document.getElementById(
        "progressText"
    );


const mediaList =
    document.getElementById(
        "mediaList"
    );


const emptyMessage =
    document.getElementById(
        "emptyMessage"
    );


/* =====================================================
   FIREBASE CONNECTION CHECK
===================================================== */

async function checkFirebase(){

    try{

        if(!db){

            throw new Error(
                "Firebase Firestore was not initialized."
            );

        }


        /*
        We perform a real Firestore read.
        This confirms that Firebase is actually
        reachable instead of only checking the
        JavaScript configuration.
        */

        await getDocs(
            collection(
                db,
                COLLECTION_NAME
            )
        );


        firebaseStatus.textContent =
            "✓ Firebase Firestore connected";


        firebaseStatus.classList.remove(
            "error"
        );


        firebaseStatus.classList.add(
            "ok"
        );


        return true;


    }catch(error){

        console.error(
            "Firebase connection error:",
            error
        );


        firebaseStatus.classList.remove(
            "ok"
        );


        firebaseStatus.classList.add(
            "error"
        );


        firebaseStatus.textContent =
            "❌ Firebase error: " +
            getFirebaseErrorMessage(
                error
            );


        return false;

    }

}


/* =====================================================
   FIREBASE ERROR MESSAGE
===================================================== */

function getFirebaseErrorMessage(
    error
){

    if(!error){

        return "Unknown error.";

    }


    const code =
        error.code || "";


    if(
        code.includes(
            "permission-denied"
        )
    ){

        return (
            "Firestore permission denied. " +
            "Check your Firebase Firestore Rules."
        );

    }


    if(
        code.includes(
            "failed-precondition"
        )
    ){

        return (
            "Firestore is not configured correctly."
        );

    }


    if(
        code.includes(
            "not-found"
        )
    ){

        return (
            "Firestore database was not found."
        );

    }


    if(
        error.message
    ){

        return error.message;

    }


    return "Unable to connect.";

}


/* =====================================================
   CLOUDINARY CHECK
===================================================== */

function checkCloudinary(){

    if(
        typeof window.uploadToCloudinary ===
        "function"
    ){

        cloudinaryStatus.textContent =
            "✓ Cloudinary upload system loaded";


        cloudinaryStatus.classList.add(
            "ok"
        );


        return true;

    }


    cloudinaryStatus.textContent =
        "❌ Cloudinary upload system not loaded";


    cloudinaryStatus.classList.add(
        "error"
    );


    return false;

}


/* =====================================================
   UPLOAD MESSAGE
===================================================== */

function showUploadMessage(
    text,
    type=""
){

    uploadMessage.textContent =
        text;


    uploadMessage.className =
        "message " +
        type;

}


/* =====================================================
   PROGRESS
===================================================== */

function setProgress(
    percent
){

    progress.classList.add(
        "show"
    );


    progressFill.style.width =
        percent + "%";


    progressText.textContent =
        percent + "%";

}


/* =====================================================
   UPLOAD MEDIA
===================================================== */

async function uploadMedia(){

    showUploadMessage(
        ""
    );


    const file =
        mediaFile.files[0];


    if(!file){

        showUploadMessage(
            "Please select an image or video.",
            "error"
        );

        return;

    }


    if(
        typeof window.uploadToCloudinary !==
        "function"
    ){

        showUploadMessage(
            "Cloudinary upload system is not loaded.",
            "error"
        );

        return;

    }


    const name =
        mediaName.value.trim() ||
        file.name;


    let type =
        mediaType.value;


    /*
    Automatically correct the type
    according to the selected file.
    */

    if(
        file.type.startsWith(
            "image/"
        )
    ){

        type = "photo";

    }


    if(
        file.type.startsWith(
            "video/"
        )
    ){

        type = "video";

    }


    uploadBtn.disabled =
        true;


    setProgress(
        0
    );


    showUploadMessage(
        "Uploading to Cloudinary..."
    );


    try{

        /* =========================================
           CLOUDINARY
        ========================================= */

        const result =
            await window.uploadToCloudinary(

                file,

                percent => {

                    setProgress(
                        percent
                    );

                }

            );


        const url =
            window.getCloudinaryUrl(
                result
            );


        if(!url){

            throw new Error(
                "Cloudinary did not return a secure URL."
            );

        }


        setProgress(
            100
        );


        showUploadMessage(
            "Cloudinary upload complete. Saving to Firebase...",
            ""
        );


        /* =========================================
           FIREBASE
        ========================================= */

        if(!db){

            throw new Error(
                "Firebase Firestore is not initialized."
            );

        }


        await addDoc(

            collection(
                db,
                COLLECTION_NAME
            ),

            {

                name:name,

                type:type,

                url:url,

                publicId:
                    result.public_id ||
                    "",

                format:
                    result.format ||
                    "",

                resourceType:
                    result.resource_type ||
                    "",

                originalFilename:
                    file.name,

                createdAt:
                    serverTimestamp()

            }

        );


        showUploadMessage(
            "✓ Media uploaded and saved successfully.",
            "ok"
        );


        mediaName.value =
            "";


        mediaFile.value =
            "";


        progressFill.style.width =
            "100%";


        progressText.textContent =
            "Complete";


        await loadMedia();


    }catch(error){

        console.error(
            "Upload error:",
            error
        );


        showUploadMessage(
            "❌ " +
            (
                error.message ||
                "Upload failed."
            ),
            "error"
        );

    }finally{

        uploadBtn.disabled =
            false;

    }

}


/* =====================================================
   LOAD MEDIA
===================================================== */

async function loadMedia(){

    mediaList.innerHTML =
        "";


    emptyMessage.style.display =
        "none";


    try{

        if(!db){

            throw new Error(
                "Firebase Firestore is not initialized."
            );

        }


        const q =
            query(

                collection(
                    db,
                    COLLECTION_NAME
                ),

                orderBy(
                    "createdAt",
                    "asc"
                )

            );


        const snapshot =
            await getDocs(
                q
            );


        if(
            snapshot.empty
        ){

            emptyMessage.style.display =
                "block";

            return;

        }


        snapshot.forEach(

            item => {

                const data =
                    item.data();


                createMediaCard(

                    item.id,

                    data

                );

            }

        );


    }catch(error){

        console.error(
            "Load media error:",
            error
        );


        emptyMessage.style.display =
            "block";


        emptyMessage.textContent =
            "❌ Could not load Firebase media: " +
            getFirebaseErrorMessage(
                error
            );

    }

}


/* =====================================================
   CREATE MEDIA CARD
===================================================== */

function createMediaCard(
    id,
    data
){

    const card =
        document.createElement(
            "div"
        );


    card.className =
        "media-card";


    const type =
        data.type === "video"
        ? "video"
        : "photo";


    let preview;


    if(
        type === "video"
    ){

        preview =
            document.createElement(
                "video"
            );


        preview.controls =
            true;


        preview.playsInline =
            true;


        preview.preload =
            "metadata";

    }else{

        preview =
            document.createElement(
                "img"
            );


        preview.alt =
            data.name ||
            "Project image";

    }


    preview.className =
        "media-preview";


    preview.src =
        data.url || "";


    const info =
        document.createElement(
            "div"
        );


    info.className =
        "media-info";


    const name =
        document.createElement(
            "div"
        );


    name.className =
        "media-name";


    name.textContent =
        data.name ||
        "Project Media";


    const typeText =
        document.createElement(
            "div"
        );


    typeText.className =
        "media-type";


    typeText.textContent =
        type === "video"
        ? "🎬 Video"
        : "📸 Photo";


    const deleteButton =
        document.createElement(
            "button"
        );


    deleteButton.className =
        "delete-btn";


    deleteButton.textContent =
        "Delete from Firebase";


    deleteButton.addEventListener(

        "click",

        () => {

            deleteMedia(
                id
            );

        }

    );


    info.appendChild(
        name
    );


    info.appendChild(
        typeText
    );


    info.appendChild(
        deleteButton
    );


    card.appendChild(
        preview
    );


    card.appendChild(
        info
    );


    mediaList.appendChild(
        card
    );

}


/* =====================================================
   DELETE MEDIA
===================================================== */

async function deleteMedia(
    id
){

    const confirmed =
        confirm(
            "Delete this media record from Firebase?"
        );


    if(!confirmed){

        return;

    }


    try{

        await deleteDoc(

            doc(
                db,
                COLLECTION_NAME,
                id
            )

        );


        await loadMedia();


    }catch(error){

        console.error(
            "Delete error:",
            error
        );


        alert(
            "Could not delete media:\n\n" +
            getFirebaseErrorMessage(
                error
            )
        );

    }

}


/* =====================================================
   BUTTON
===================================================== */

uploadBtn.addEventListener(
    "click",
    uploadMedia
);


/* =====================================================
   START
===================================================== */

async function startEditor(){

    /*
    IMPORTANT:
    Load the Cloudinary script first.
    */

    checkCloudinary();


    /*
    Then check Firebase.
    */

    const connected =
        await checkFirebase();


    if(
        connected
    ){

        await loadMedia();

    }

}


startEditor();


</script>

</body>

</html>
